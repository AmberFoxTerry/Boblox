<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxxyDen - Customization</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }

        .content {
            padding: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .preview-box {
            width: 100%;
            max-width: 500px;
            height: 260px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
        }

        .player {
            width: 110px;
            height: 110px;
            background: #d3d3d3;
            border: 2px solid #aaa;
        }

        .colors {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
        }

        .color {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 7px;
            background: #fafafa;
        }

        .color-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            font-weight: 600;
        }

        .dot {
            width: 30px;
            height: 30px;
            border-radius: 4px;
        }

        .gray {
            background: #d3d3d3;
        }

        .red {
            background: red;
        }

        .green {
            background: green;
        }

        .blue {
            background: blue;
        }

        .creator {
            font-size: 14px;
            color: #666;
            font-weight: normal;
            margin-top: 3px;
            display: flex;
            align-items: center;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            line-height: 20px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 9px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        button.equipped {
            background: #555;
            cursor: default;
        }

        button.equip {
            background: #32CD32;
            color: #111;
        }

        button.equip:hover {
            background: #28b828;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div
            class="logo"
            onclick="location.href='index.html'"
        >
            FoxxyDen
        </div>

    </div>


    <div class="sidebar" id="sidebar">

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <div class="content">

        <h1>
            Customization
        </h1>


        <div class="preview-box">

            <div
                class="player"
                id="player"
            ></div>

        </div>


        <div
            class="colors"
            id="colors"
        ></div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const colorItems = [
            {
                id: "red",
                name: "Red",
                className: "red",
                color: "red"
            },
            {
                id: "green",
                name: "Green",
                className: "green",
                color: "green"
            },
            {
                id: "blue",
                name: "Blue",
                className: "blue",
                color: "blue"
            }
        ];


        let session = null;

        let owned = [];

        let equipped = "gray";


        function toggleMenu() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }


        function verificationBadge() {

            return `
                <span class="verified">
                    <span>✓</span>
                </span>
            `;

        }


        function updatePreview() {

            const player =
                document.getElementById("player");


            if (equipped === "gray") {

                player.style.background =
                    "#d3d3d3";

                player.style.borderColor =
                    "#aaa";

                return;
            }


            const item =
                colorItems.find(
                    function(color) {
                        return color.id === equipped;
                    }
                );


            if (!item) {

                player.style.background =
                    "#d3d3d3";

                player.style.borderColor =
                    "#aaa";

                return;
            }


            player.style.background =
                item.color;

            player.style.borderColor =
                item.color;

        }


        async function equipColor(colorId) {

            if (!session) {
                return;
            }

            if (!owned.includes(colorId)) {
                return;
            }


            const { error } =
                await db
                    .from("profiles")
                    .update({
                        equipped: colorId
                    })
                    .eq("uuid", session.user.id);


            if (error) {

                console.error(
                    "Could not equip item:",
                    error
                );

                return;
            }


            equipped =
                colorId;


            renderCustomization();
            updatePreview();

        }


        async function equipGray() {

            if (!session) {
                return;
            }


            const { error } =
                await db
                    .from("profiles")
                    .update({
                        equipped: "gray"
                    })
                    .eq("uuid", session.user.id);


            if (error) {

                console.error(
                    "Could not equip Default Gray:",
                    error
                );

                return;
            }


            equipped =
                "gray";


            renderCustomization();
            updatePreview();

        }


        function renderCustomization() {

            const container =
                document.getElementById("colors");

            container.innerHTML = "";


            const defaultColor =
                document.createElement("div");

            defaultColor.className =
                "color";


            defaultColor.innerHTML = `

                <div class="color-info">

                    <div class="dot gray"></div>

                    <div>

                        Default Gray

                        <div class="creator">
                            FoxxyDen Default
                        </div>

                    </div>

                </div>

                <button
                    class="${equipped === "gray" ? "equipped" : "equip"}"
                    ${equipped === "gray" ? "disabled" : ""}
                    onclick="equipGray()"
                >
                    ${equipped === "gray" ? "Equipped" : "Equip"}
                </button>

            `;


            container.appendChild(
                defaultColor
            );


            colorItems.forEach(
                function(item) {

                    if (
                        !owned.includes(
                            item.id
                        )
                    ) {
                        return;
                    }


                    const element =
                        document.createElement(
                            "div"
                        );

                    element.className =
                        "color";


                    const isEquipped =
                        equipped === item.id;


                    element.innerHTML = `

                        <div class="color-info">

                            <div class="dot ${item.className}"></div>

                            <div>

                                ${item.name}

                                <div class="creator">
                                    Creator: Terry
                                    ${verificationBadge()}
                                </div>

                            </div>

                        </div>

                        <button
                            class="${isEquipped ? "equipped" : "equip"}"
                            ${isEquipped ? "disabled" : ""}
                            onclick="equipColor('${item.id}')"
                        >
                            ${isEquipped ? "Equipped" : "Equip"}
                        </button>

                    `;


                    container.appendChild(
                        element
                    );

                }
            );

        }


        async function loadCustomization() {

            const {
                data: {
                    session: currentSession
                }
            } =
                await db.auth.getSession();


            session =
                currentSession;


            if (!session) {

                owned = [];

                equipped = "gray";

                renderCustomization();
                updatePreview();

                return;
            }


            const { data, error } =
                await db
                    .from("profiles")
                    .select(
                        "owned, equipped"
                    )
                    .eq(
                        "uuid",
                        session.user.id
                    )
                    .single();


            if (error) {

                console.error(
                    "Could not load profile:",
                    error
                );

                renderCustomization();
                updatePreview();

                return;
            }


            owned =
                Array.isArray(data.owned)
                    ? data.owned
                    : [];


            equipped =
                data.equipped ||
                "gray";


            renderCustomization();
            updatePreview();

        }


        loadCustomization();

    </script>

</body>
</html>
