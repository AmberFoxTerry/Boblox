<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoxxyDen - PROFILE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
    }

    /* TOP BAR */

    .topbar {
        height: 60px;
        background: #ff8c00;
        display: flex;
        align-items: center;
        padding: 0 20px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
    }

    .menu-button {
        font-size: 28px;
        cursor: pointer;
        margin-right: 20px;
        user-select: none;
    }

    .logo {
        font-size: 25px;
        font-weight: bold;
    }

    /* SIDEBAR */

    .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 220px;
        height: calc(100vh - 60px);
        background: #181818;
        border-right: 1px solid #333;
        padding-top: 20px;
        transform: translateX(-220px);
        transition: transform 0.2s ease;
        z-index: 999;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 16px 22px;
        font-size: 17px;
    }

    .sidebar a:hover {
        background: #252525;
    }

    /* MAIN */

    .main {
        padding: 60px 40px 40px;
        min-height: 100vh;
    }

    .profile-container {
        max-width: 1000px;
        margin: 0 auto;
        padding-top: 180px;
    }

    /* PROFILE HEADER */

    .profile-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 50px;
    }

    .profile-info {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .profile-pfp {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        background: #222;
    }

    .display-name-row {
        display: flex;
        align-items: center;
    }

    .display-name {
        font-size: 32px;
        font-weight: bold;
    }

    /* VERIFICATION HEART */

    .verified {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        margin-left: 7px;
        flex-shrink: 0;
    }

    .verified::before {
        content: "♥";
        position: absolute;
        color: #ff69b4;
        font-size: 26px;
        line-height: 26px;
    }

    .verified span {
        position: relative;
        z-index: 1;
        color: white;
        font-size: 12px;
        font-weight: 900;
        line-height: 1;
        transform: translateY(-1px);
    }

    /* CHARACTER PREVIEW */

    .character-preview {
        width: 220px;
        height: 220px;
        background: #181818;
        border: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
    }

    .character {
        width: 140px;
        height: 140px;
        background: #777;
        border-radius: 8px;
        box-shadow:
            inset 0 0 0 4px #555,
            0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* DIVIDERS */

    .divider {
        height: 1px;
        background: #333;
        margin: 45px 0;
    }

    /* SECTIONS */

    .section-title {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .wearing {
        min-height: 80px;
        color: #aaa;
        font-size: 16px;
    }

    .bio {
        color: #ddd;
        font-size: 17px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 40px;
    }

    .empty {
        color: #666;
    }

    /* MOBILE */

    @media (max-width: 700px) {
        .main {
            padding-left: 20px;
            padding-right: 20px;
        }

        .profile-container {
            padding-top: 120px;
        }

        .profile-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .character-preview {
            align-self: center;
        }

        .profile-info {
            width: 100%;
        }

        .profile-pfp {
            width: 85px;
            height: 85px;
        }

        .display-name {
            font-size: 25px;
        }
    }
</style>
</head>

<body>

<!-- TOP BAR -->

<div class="topbar">
    <div class="menu-button" onclick="toggleSidebar()">☰</div>
    <div class="logo">FoxxyDen</div>
</div>

<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">
    <a href="shop.html">Shop</a>
    <a href="customazition.html">Customization</a>
    <a href="settings.html">Settings</a>
</div>

<!-- MAIN -->

<div class="main">

    <div class="profile-container">

        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-info">

                <img
                    id="profilePfp"
                    class="profile-pfp"
                    src=""
                    alt="Profile picture"
                >

                <div class="display-name-row">
                    <div id="displayName" class="display-name">
                        Player
                    </div>

                    <div
                        id="verifiedBadge"
                        class="verified"
                        style="display: none;"
                    >
                        <span>✓</span>
                    </div>
                </div>

            </div>

            <!-- SAME CHARACTER PREVIEW -->

            <div class="character-preview">
                <div class="character" id="characterPreview"></div>
            </div>

        </div>

        <div class="divider"></div>

        <!-- CURRENTLY WEARING -->

        <h2 class="section-title">
            Currently wearing
        </h2>

        <div id="wearing" class="wearing">
            <span class="empty">
                Default Gray
            </span>
        </div>

        <div class="divider"></div>

        <!-- BIO -->

        <h2 class="section-title">
            Bio
        </h2>

        <div id="bio" class="bio">
            <span class="empty">
                No bio yet.
            </span>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* VERIFIED USERS */

const VERIFIED_UIDS = [
    "ca2cdea0-9fbd-4380-a34b-e505540ade35"
];


/* SIDEBAR */

function toggleSidebar() {
    document
        .getElementById("sidebar")
        .classList.toggle("open");
}


/* LOAD PROFILE */

async function loadProfile() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();

    if (!session) {
        window.location.href = "index.html";
        return;
    }

    const currentUser = session.user;

    /* DISCORD DISPLAY NAME */

    const metadata = currentUser.user_metadata || {};

    const displayName =
        metadata.full_name ||
        metadata.name ||
        metadata.global_name ||
        metadata.preferred_username ||
        "Player";

    document.getElementById("displayName").textContent =
        displayName;


    /* DISCORD PROFILE PICTURE */

    let avatarUrl =
        metadata.avatar_url ||
        metadata.picture ||
        "";

    if (avatarUrl) {
        document.getElementById("profilePfp").src =
            avatarUrl;
    }


    /* VERIFIED BADGE */

    if (VERIFIED_UIDS.includes(currentUser.id)) {
        document.getElementById("verifiedBadge").style.display =
            "inline-flex";
    }


    /* LOAD DATABASE PROFILE */

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("bio, owned")
        .eq("uuid", currentUser.id)
        .single();

    if (error) {
        console.error(
            "Failed to load profile:",
            error
        );
        return;
    }


    /* BIO */

    const bioElement =
        document.getElementById("bio");

    if (data.bio && data.bio.trim() !== "") {

        bioElement.textContent =
            data.bio;

    } else {

        bioElement.innerHTML =
            '<span class="empty">No bio yet.</span>';

    }


    /* OWNED ITEMS */

    /*
        For now the character is always
        the default gray character.

        Later this is where the owned/equipped
        items can be used to build the character.
    */

    const wearingElement =
        document.getElementById("wearing");

    wearingElement.innerHTML =
        '<span class="empty">Default Gray</span>';

}


/* START */

loadProfile();

</script>

</body>
</html>
