<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoxxyDen - Profile</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* TOP BAR */

        .topbar {
            height: 60px;
            background: #fff;
            color: #111;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .menu {
            font-size: 25px;
            cursor: pointer;
            margin-right: 20px;
            user-select: none;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .profile-button {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            position: relative;
        }

        .profile-button img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-weight: bold;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 3px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        /* DROPDOWN */

        .dropdown {
            display: none;
            position: absolute;
            top: 48px;
            right: 0;
            width: 170px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 7px;
            overflow: hidden;
            z-index: 200;
        }

        .dropdown div {
            padding: 12px 15px;
            cursor: pointer;
        }

        .dropdown div:hover {
            background: #333;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 60px;
            left: -230px;
            bottom: 0;
            width: 230px;
            background: #181818;
            border-right: 1px solid #333;
            transition: left 0.2s;
            z-index: 90;
            padding-top: 10px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #292929;
        }

        /* PAGE */

        .page {
            max-width: 1000px;
            margin: auto;
            padding: 130px 35px 60px;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 50px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user img {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
        }

        .display-name {
            display: flex;
            align-items: center;
            font-size: 30px;
            font-weight: bold;
        }

        /* CHARACTER PREVIEW
           Same simple white/gray FoxxyDen preview style.
        */

        .character-preview {
            width: 260px;
            height: 260px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character {
            width: 125px;
            height: 155px;
            background: #bdbdbd;
            border-radius: 8px;
            position: relative;
        }

        .character::before {
            content: "";
            position: absolute;
            left: 12px;
            right: 12px;
            top: 12px;
            height: 55px;
            background: #f2f2f2;
            border-radius: 6px;
        }

        .character::after {
            content: "";
            position: absolute;
            left: 22px;
            right: 22px;
            bottom: 12px;
            height: 58px;
            background: #8f8f8f;
            border-radius: 6px;
        }

        /* DIVIDER */

        .divider {
            height: 1px;
            background: #333;
            margin: 40px 0;
        }

        /* CURRENTLY WEARING */

        h2 {
            margin: 0 0 20px;
            font-size: 23px;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .item {
            width: 170px;
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
        }

        .item-preview {
            height: 130px;
            background: #bdbdbd;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-preview-inner {
            width: 65px;
            height: 80px;
            background: #8f8f8f;
            border-radius: 5px;
        }

        .item-name {
            font-weight: bold;
        }

        .item-status {
            margin-top: 5px;
            color: #aaa;
            font-size: 13px;
        }

        /* BIO */

        .bio {
            background: #1c1c1c;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 18px;
            min-height: 90px;
            color: #ddd;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 700px) {

            .page {
                padding-left: 20px;
                padding-right: 20px;
            }

            .profile-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .character-preview {
                width: 100%;
                max-width: 260px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="menu" onclick="toggleSidebar()">
            ☰
        </div>

        <div class="logo">
            FoxxyDen
        </div>

        <div class="profile-button" onclick="toggleDropdown()">

            <img id="topPfp" src="" alt="">

            <span id="topName" class="profile-name">
                Player
            </span>

            <span id="topVerified"></span>

            <div id="dropdown" class="dropdown">

                <div onclick="openProfile(event)">
                    View Profile
                </div>

                <div onclick="signOut(event)">
                    Sign Out
                </div>

            </div>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <!-- PROFILE -->

    <main class="page">

        <div class="profile-header">

            <div class="user">

                <img id="profilePfp" src="" alt="">

                <div class="display-name">

                    <span id="displayName">
                        Player
                    </span>

                    <span id="profileVerified"></span>

                </div>

            </div>


            <!-- SAME CHARACTER AREA -->

            <div class="character-preview">

                <div class="character"></div>

            </div>

        </div>


        <div class="divider"></div>


        <!-- CURRENTLY WEARING -->

        <h2>
            Currently wearing
        </h2>

        <div id="items" class="items">

            <div class="item">

                <div class="item-preview">

                    <div class="item-preview-inner"></div>

                </div>

                <div class="item-name">
                    Default Gray
                </div>

                <div class="item-status">
                    Equipped
                </div>

            </div>

        </div>


        <div class="divider"></div>


        <!-- BIO -->

        <h2>
            Bio
        </h2>

        <div id="bio" class="bio">

            <span class="empty">
                No bio yet.
            </span>

        </div>

    </main>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /* ONLY YOUR ACCOUNT IS VERIFIED */

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];


        function verifiedBadge(userId) {

            if (!VERIFIED_UIDS.includes(userId)) {
                return "";
            }

            return `
                <span class="verified">
                    <span>✓</span>
                </span>
            `;
        }


        /* SIDEBAR */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }


        /* DROPDOWN */

        function toggleDropdown() {

            const dropdown =
                document.getElementById("dropdown");

            dropdown.style.display =
                dropdown.style.display === "block"
                    ? "none"
                    : "block";

        }


        function openProfile(event) {

            event.stopPropagation();

            window.location.href =
                "profile.html";

        }


        /* SIGN OUT */

        async function signOut(event) {

            event.stopPropagation();

            await db.auth.signOut();

            window.location.href =
                "index.html";

        }


        /* LOAD PROFILE */

        async function loadProfile() {

            const {
                data: {
                    session
                }
            } = await db.auth.getSession();


            if (!session) {

                window.location.href =
                    "index.html";

                return;

            }


            const user =
                session.user;


            const metadata =
                user.user_metadata || {};


            /*
                Discord display name.

                global_name = Discord Display Name
                user_name    = Discord username

                We intentionally DO NOT use user_name.
            */

            const displayName =
                metadata.custom_claims?.global_name ||
                metadata.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Player";


            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";


            /* TOP BAR */

            document
                .getElementById("topName")
                .textContent = displayName;


            document
                .getElementById("displayName")
                .textContent = displayName;


            if (avatar) {

                document
                    .getElementById("topPfp")
                    .src = avatar;

                document
                    .getElementById("profilePfp")
                    .src = avatar;

            }


            /* VERIFIED */

            const badge =
                verifiedBadge(user.id);


            document
                .getElementById("topVerified")
                .innerHTML = badge;


            document
                .getElementById("profileVerified")
                .innerHTML = badge;


            /* DATABASE PROFILE */

            const {
                data,
                error
            } = await db
                .from("profiles")
                .select("bio, owned")
                .eq("uuid", user.id)
                .single();


            if (error) {

                console.error(
                    "Profile loading error:",
                    error
                );

                return;

            }


            /* BIO */

            const bio =
                data.bio || "";


            if (bio.trim() === "") {

                document
                    .getElementById("bio")
                    .innerHTML =
                    `<span class="empty">No bio yet.</span>`;

            } else {

                document
                    .getElementById("bio")
                    .textContent =
                    bio;

            }


            /*
                CURRENTLY WEARING

                Same visual item box idea as
                customization, but NO Equip button.
            */

            loadCurrentlyWearing(data.owned);

        }


        function loadCurrentlyWearing(owned) {

            const container =
                document.getElementById("items");


            container.innerHTML = `

                <div class="item">

                    <div class="item-preview">

                        <div class="item-preview-inner"></div>

                    </div>

                    <div class="item-name">
                        Default Gray
                    </div>

                    <div class="item-status">
                        Equipped
                    </div>

                </div>

            `;

        }


        loadProfile();

    </script>

</body>
</html>
