<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FoxxyDen - PROFILE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #111;
}

/* TOP BAR */

.topbar {
    height: 60px;
    background: #ff8c00;
    display: flex;
    align-items: center;
    padding: 0 20px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
}

.menu-button {
    font-size: 28px;
    cursor: pointer;
    margin-right: 20px;
    user-select: none;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

/* SIDEBAR */

.sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 220px;
    height: calc(100vh - 60px);
    background: white;
    border-right: 1px solid #ddd;
    padding-top: 20px;
    transform: translateX(-220px);
    transition: transform 0.2s ease;
    z-index: 999;
}

.sidebar.open {
    transform: translateX(0);
}

.sidebar a {
    display: block;
    color: #111;
    text-decoration: none;
    padding: 16px 22px;
    font-size: 17px;
}

.sidebar a:hover {
    background: #f0f0f0;
}

/* MAIN */

.main {
    padding: 60px 40px 40px;
}

.profile-container {
    max-width: 1000px;
    margin: 0 auto;
    padding-top: 180px;
}

/* PROFILE */

.profile-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.profile-left {
    display: flex;
    align-items: center;
    gap: 20px;
}

.profile-pfp {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
}

.profile-name {
    display: flex;
    align-items: center;
    font-size: 30px;
    font-weight: bold;
}

/* VERIFIED */

.verified {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin-left: 5px;
    flex-shrink: 0;
}

.verified::before {
    content: "♥";
    position: absolute;
    color: #ff69b4;
    font-size: 26px;
    line-height: 26px;
}

.verified span {
    position: relative;
    z-index: 1;
    color: white;
    font-size: 12px;
    font-weight: 900;
    line-height: 1;
    transform: translateY(-1px);
}

/* CHARACTER PREVIEW */

.character-preview {
    width: 180px;
    height: 180px;
    background: #eee;
    border: 1px solid #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
}

.character {
    width: 120px;
    height: 120px;
    background: #999;
}

/* DIVIDER */

.divider {
    height: 1px;
    background: #ddd;
    margin: 40px 0;
}

/* SECTIONS */

.section-title {
    font-size: 24px;
    margin-bottom: 20px;
}

/* CURRENTLY WEARING */

.wearing-items {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.item-box {
    width: 160px;
    background: white;
    border: 1px solid #ddd;
    padding: 15px;
}

.item-preview {
    width: 100%;
    height: 120px;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}

.item-preview-inner {
    width: 75px;
    height: 75px;
    background: #999;
}

.item-name {
    font-size: 16px;
    font-weight: bold;
}

/* BIO */

.bio {
    background: white;
    border: 1px solid #ddd;
    padding: 15px;
    min-height: 60px;
    white-space: pre-wrap;
    word-break: break-word;
}

.empty {
    color: #888;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="menu-button" onclick="toggleSidebar()">☰</div>
    <div class="logo">FoxxyDen</div>
</div>

<div class="sidebar" id="sidebar">
    <a href="shop.html">Shop</a>
    <a href="customazition.html">Customization</a>
    <a href="settings.html">Settings</a>
</div>

<div class="main">

    <div class="profile-container">

        <div class="profile-top">

            <div class="profile-left">

                <img
                    id="profilePfp"
                    class="profile-pfp"
                    src=""
                    alt="Profile picture"
                >

                <div class="profile-name">
                    <span id="displayName">Player</span>

                    <div
                        id="verifiedBadge"
                        class="verified"
                        style="display:none;"
                    >
                        <span>✓</span>
                    </div>
                </div>

            </div>

            <!-- SAME DEFAULT CHARACTER PREVIEW -->

            <div class="character-preview">
                <div class="character"></div>
            </div>

        </div>

        <div class="divider"></div>

        <h2 class="section-title">
            Currently wearing
        </h2>

        <!-- SAME STYLE OF ITEM BOX, WITHOUT EQUIP BUTTON -->

        <div class="wearing-items">

            <div class="item-box">

                <div class="item-preview">
                    <div class="item-preview-inner"></div>
                </div>

                <div class="item-name">
                    Default Gray
                </div>

            </div>

        </div>

        <div class="divider"></div>

        <h2 class="section-title">
            Bio
        </h2>

        <div id="bio" class="bio">
            <span class="empty">
                No bio yet.
            </span>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const VERIFIED_UIDS = [
    "ca2cdea0-9fbd-4380-a34b-e505540ade35"
];

function toggleSidebar() {
    document
        .getElementById("sidebar")
        .classList.toggle("open");
}

async function loadProfile() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();

    if (!session) {
        window.location.href = "index.html";
        return;
    }

    const currentUser = session.user;
    const metadata = currentUser.user_metadata || {};

    const displayName =
        metadata.full_name ||
        metadata.name ||
        metadata.global_name ||
        metadata.preferred_username ||
        "Player";

    document.getElementById("displayName").textContent =
        displayName;

    const avatarUrl =
        metadata.avatar_url ||
        metadata.picture ||
        "";

    if (avatarUrl) {
        document.getElementById("profilePfp").src =
            avatarUrl;
    }

    if (VERIFIED_UIDS.includes(currentUser.id)) {
        document.getElementById("verifiedBadge").style.display =
            "inline-flex";
    }

    const {
        data,
        error
    } = await db
        .from("profiles")
        .select("bio, owned")
        .eq("uuid", currentUser.id)
        .single();

    if (error) {
        console.error(error);
        return;
    }

    if (data.bio && data.bio.trim() !== "") {

        document.getElementById("bio").textContent =
            data.bio;

    } else {

        document.getElementById("bio").innerHTML =
            '<span class="empty">No bio yet.</span>';

    }
}

loadProfile();

</script>

</body>
</html>
