<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoxxyDen - Profile</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 60px;
            background: #ff69b4;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }

        .menu-button {
            font-size: 25px;
            cursor: pointer;
            margin-right: 20px;
            user-select: none;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .top-profile {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
        }

        .top-profile img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
        }

        .top-profile-name {
            font-weight: bold;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        /* =========================
           DROPDOWN
        ========================= */

        .dropdown {
            display: none;
            position: absolute;
            top: 50px;
            right: 0;
            background: #222;
            border: 1px solid #444;
            min-width: 160px;
            border-radius: 8px;
            overflow: hidden;
            z-index: 200;
        }

        .dropdown div {
            padding: 12px 15px;
            cursor: pointer;
        }

        .dropdown div:hover {
            background: #333;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            top: 60px;
            left: -230px;
            width: 230px;
            bottom: 0;
            background: #181818;
            border-right: 1px solid #333;
            transition: left 0.2s;
            z-index: 90;
            padding-top: 15px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            font-size: 17px;
        }

        .sidebar a:hover {
            background: #292929;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            padding: 130px 40px 60px;
            max-width: 1100px;
            margin: auto;
        }

        .profile-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 50px;
        }

        /* =========================
           USER
        ========================= */

        .user-info {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 180px;
        }

        .profile-pfp {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            background: #222;
        }

        .display-name {
            font-size: 32px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        /* =========================
           CHARACTER PREVIEW
        ========================= */

        .character-preview {
            width: 300px;
            height: 300px;
            background: #1b1b1b;
            border: 1px solid #333;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
            Same default character currently
            used by customazition.html.
        */

        .character {
            width: 150px;
            height: 150px;
            background: #888;
            border-radius: 8px;
            box-shadow:
                0 0 0 4px #666,
                0 12px 25px rgba(0, 0, 0, 0.45);
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            height: 1px;
            background: #333;
            margin: 45px 0;
        }

        /* =========================
           CURRENTLY WEARING
        ========================= */

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }

        .item {
            width: 180px;
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
        }

        .item-preview {
            width: 100%;
            height: 140px;
            background: #888;
            border-radius: 7px;
            margin-bottom: 12px;
        }

        .item-name {
            font-size: 17px;
            font-weight: bold;
        }

        .item-status {
            margin-top: 5px;
            color: #aaa;
            font-size: 14px;
        }

        /* =========================
           BIO
        ========================= */

        .bio {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #ddd;
        }

        .empty {
            color: #777;
        }

        @media (max-width: 700px) {
            .page {
                padding: 110px 20px 40px;
            }

            .profile-top {
                flex-direction: column;
            }

            .character-preview {
                width: 100%;
                max-width: 300px;
            }

            .user-info {
                min-height: auto;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <div class="menu-button" onclick="toggleSidebar()">☰</div>

        <div class="logo">
            FoxxyDen
        </div>

        <div class="top-profile" onclick="toggleDropdown()">

            <img id="topPfp" src="" alt="">

            <span id="topName" class="top-profile-name">
                Player
            </span>

            <span id="topVerified"></span>

            <div id="dropdown" class="dropdown">

                <div onclick="goProfile(event)">
                    View Profile
                </div>

                <div onclick="signOut(event)">
                    Sign Out
                </div>

            </div>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div id="sidebar" class="sidebar">

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <!-- PROFILE -->

    <main class="page">

        <div class="profile-top">

            <!-- USER INFO -->

            <div class="user-info">

                <img
                    id="profilePfp"
                    class="profile-pfp"
                    src=""
                    alt="Profile picture"
                >

                <div>

                    <div class="display-name">

                        <span id="displayName">
                            Player
                        </span>

                        <span id="profileVerified"></span>

                    </div>

                </div>

            </div>


            <!-- CHARACTER -->

            <div class="character-preview">

                <div class="character"></div>

            </div>

        </div>


        <div class="divider"></div>


        <!-- CURRENTLY WEARING -->

        <h2>
            Currently wearing
        </h2>

        <div id="items" class="items">

            <div class="item">

                <div class="item-preview"></div>

                <div class="item-name">
                    Default Gray
                </div>

                <div class="item-status">
                    Equipped
                </div>

            </div>

        </div>


        <div class="divider"></div>


        <!-- BIO -->

        <h2>
            Bio
        </h2>

        <div id="bio" class="bio">

            <span class="empty">
                No bio yet.
            </span>

        </div>

    </main>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        /*
            Your verified Supabase UID.

            This is only used to decide whether
            the heart badge should be displayed.
        */

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];


        /* =========================
           VERIFIED BADGE
        ========================= */

        function verifiedBadge(userId) {

            if (!VERIFIED_UIDS.includes(userId)) {
                return "";
            }

            return `
                <span class="verified">
                    <span>✓</span>
                </span>
            `;
        }


        /* =========================
           SIDEBAR
        ========================= */

        function toggleSidebar() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }


        /* =========================
           DROPDOWN
        ========================= */

        function toggleDropdown() {

            const dropdown =
                document.getElementById("dropdown");

            dropdown.style.display =
                dropdown.style.display === "block"
                    ? "none"
                    : "block";

        }


        function goProfile(event) {

            event.stopPropagation();

            window.location.href =
                "profile.html";

        }


        /* =========================
           SIGN OUT
        ========================= */

        async function signOut(event) {

            event.stopPropagation();

            await db.auth.signOut();

            window.location.href =
                "index.html";

        }


        /* =========================
           LOAD PROFILE
        ========================= */

        async function loadProfile() {

            const {
                data: {
                    session
                }
            } = await db.auth.getSession();


            if (!session) {

                window.location.href =
                    "index.html";

                return;
            }


            const user =
                session.user;


            /*
                Discord display name.
                Username is NOT displayed publicly.
            */

            const metadata =
                user.user_metadata || {};


            const displayName =
                metadata.full_name ||
                metadata.name ||
                metadata.custom_claims?.global_name ||
                metadata.user_name ||
                "Player";


            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";


            /* TOP PROFILE */

            document
                .getElementById("topName")
                .textContent = displayName;


            document
                .getElementById("displayName")
                .textContent = displayName;


            if (avatar) {

                document
                    .getElementById("topPfp")
                    .src = avatar;

                document
                    .getElementById("profilePfp")
                    .src = avatar;

            }


            /* VERIFICATION */

            const badge =
                verifiedBadge(user.id);


            document
                .getElementById("topVerified")
                .innerHTML = badge;


            document
                .getElementById("profileVerified")
                .innerHTML = badge;


            /* PROFILE DATABASE */

            const {
                data,
                error
            } = await db
                .from("profiles")
                .select("bio, owned")
                .eq("uuid", user.id)
                .single();


            if (error) {

                console.error(
                    "Failed to load profile:",
                    error
                );

                return;
            }


            /* BIO */

            const bio =
                data.bio || "";


            const bioElement =
                document.getElementById("bio");


            if (bio.trim() === "") {

                bioElement.innerHTML =
                    `<span class="empty">No bio yet.</span>`;

            } else {

                bioElement.textContent =
                    bio;

            }


            /*
                Currently wearing.

                For now the default gray item is
                equipped, matching customization.
                
                No Equip button is shown here.
            */

            loadWearing(data.owned);

        }


        /* =========================
           CURRENTLY WEARING
        ========================= */

        function loadWearing(owned) {

            const container =
                document.getElementById("items");


            /*
                Currently there is only the default
                gray item, so the profile displays it
                exactly as an equipped customization item.
            */

            container.innerHTML = `

                <div class="item">

                    <div class="item-preview"></div>

                    <div class="item-name">
                        Default Gray
                    </div>

                    <div class="item-status">
                        Equipped
                    </div>

                </div>

            `;

        }


        /* =========================
           START
        ========================= */

        loadProfile();

    </script>

</body>
</html>
