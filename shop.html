<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxxyDen - Shop</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .balance {
            position: absolute;
            right: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }

        .content {
            padding: 40px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
        }

        .items {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
        }

        .item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 7px;
            background: #fafafa;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-text {
            font-size: 18px;
            font-weight: 600;
        }

        .creator {
            font-size: 14px;
            color: #666;
            font-weight: normal;
            margin-top: 4px;
            display: flex;
            align-items: center;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            line-height: 20px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 9px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        .dot {
            width: 38px;
            height: 38px;
            border-radius: 5px;
            border: 1px solid rgba(0, 0, 0, 0.15);
        }

        .red {
            background: red;
        }

        .green {
            background: green;
        }

        .blue {
            background: blue;
        }

        button {
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .free {
            background: #7CFC00;
            color: #111;
        }

        .free:hover {
            background: #70e600;
        }

        .purchased {
            background: #888;
            cursor: default;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div
            class="logo"
            onclick="location.href='index.html'"
        >
            FoxxyDen
        </div>

        <div
            class="balance"
            id="balance"
        >
            0 FoxCoins
        </div>

    </div>


    <div
        class="sidebar"
        id="sidebar"
    >

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <div class="content">

        <h1>
            Shop
        </h1>

        <div
            class="items"
            id="items"
        ></div>

    </div>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        const shopItems = [
            {
                id: "red",
                name: "Red",
                className: "red"
            },
            {
                id: "green",
                name: "Green",
                className: "green"
            },
            {
                id: "blue",
                name: "Blue",
                className: "blue"
            }
        ];


        let session = null;
        let owned = [];


        function toggleMenu() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }


        function verificationBadge() {

            return `
                <span class="verified">
                    <span>✓</span>
                </span>
            `;

        }


        async function loadShop() {

            const {
                data: { session: currentSession }
            } = await db.auth.getSession();

            session = currentSession;


            if (!session) {

                owned = [];
                renderShop();
                return;

            }


            const { data, error } =
                await db
                    .from("profiles")
                    .select("owned, currency")
                    .eq("uuid", session.user.id)
                    .single();


            if (error) {

                console.error(
                    "Could not load profile:",
                    error
                );

                renderShop();
                return;

            }


            owned = Array.isArray(data.owned)
                ? data.owned
                : [];


            const currency =
                Number(data.currency) || 0;


            document
                .getElementById("balance")
                .textContent =
                    currency.toLocaleString() +
                    " FoxCoins";


            renderShop();

        }


        function renderShop() {

            const container =
                document.getElementById("items");

            container.innerHTML = "";


            shopItems.forEach(function(item) {

                const isOwned =
                    owned.includes(item.id);


                const element =
                    document.createElement("div");

                element.className = "item";


                element.innerHTML = `

                    <div class="item-info">

                        <div class="dot ${item.className}"></div>

                        <div>

                            <div class="item-text">
                                ${item.name}
                            </div>

                            <div class="creator">
                                Creator: Terry
                                ${verificationBadge()}
                            </div>

                        </div>

                    </div>

                    <button
                        class="${isOwned ? "purchased" : "free"}"
                        ${isOwned ? "disabled" : ""}
                        onclick="buyItem('${item.id}')"
                    >
                        ${isOwned ? "Purchased" : "FREE"}
                    </button>

                `;


                container.appendChild(element);

            });

        }


        async function buyItem(itemId) {

            if (!session) {

                alert("You need to log in first.");
                return;

            }


            if (owned.includes(itemId)) {
                return;
            }


            const newOwned = [
                ...owned,
                itemId
            ];


            const { error } =
                await db
                    .from("profiles")
                    .update({
                        owned: newOwned
                    })
                    .eq("uuid", session.user.id);


            if (error) {

                console.error(
                    "Could not purchase item:",
                    error
                );

                alert("Could not purchase item.");
                return;

            }


            owned = newOwned;

            renderShop();

        }


        loadShop();

    </script>

</body>
</html>
