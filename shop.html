<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxxyDen - SHOP</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        .balance {
            position: absolute;
            right: 20px;
            font-size: 16px;
            font-weight: 700;
            color: #111;
        }

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }

        .content {
            padding: 40px;
        }

        h1 {
            font-size: 32px;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div
            class="menu"
            onclick="toggleMenu()"
        >
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div
            class="logo"
            onclick="location.href='index.html'"
        >
            FoxxyDen
        </div>

        <div
            class="balance"
            id="balance"
        >
            0 FoxCoins
        </div>

    </div>


    <div
        class="sidebar"
        id="sidebar"
    >

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <div class="content">

        <h1>
            Shop
        </h1>

    </div>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        function toggleMenu() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");

        }


        async function loadBalance() {

            const {
                data: { session }
            } = await db.auth.getSession();


            if (!session) {

                document
                    .getElementById("balance")
                    .textContent = "0 FoxCoins";

                return;
            }


            const { data, error } =
                await db
                    .from("profiles")
                    .select("currency")
                    .eq("uuid", session.user.id)
                    .single();


            if (error) {

                console.error(
                    "Could not load currency:",
                    error
                );

                return;
            }


            const currency =
                Number(data.currency) || 0;


            document
                .getElementById("balance")
                .textContent =
                    currency.toLocaleString() +
                    " FoxCoins";
        }


        loadBalance();

    </script>

</body>
</html>
