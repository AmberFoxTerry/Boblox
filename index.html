<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoxxyDen - Menu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #111;
        }

        .topbar {
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .menuButton {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
            margin-right: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .account {
            margin-left: auto;
            display: flex;
            align-items: center;
            position: relative;
        }

        .loginButton {
            border: none;
            background: #111;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .profile {
            display: none;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }

        .profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .profileName {
            font-weight: 700;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        .profileMenu {
            display: none;
            position: absolute;
            right: 0;
            top: 52px;
            width: 180px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 7px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .profileMenu.open {
            display: block;
        }

        .profileMenu button {
            width: 100%;
            border: none;
            background: white;
            text-align: left;
            padding: 13px;
            cursor: pointer;
            font-size: 14px;
        }

        .profileMenu button:hover {
            background: #f3f3f3;
        }

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            bottom: 0;
            background: #f3f3f3;
            transition: left 0.2s ease;
            z-index: 900;
            padding: 20px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            padding: 13px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background: #ddd;
        }

        .searchArea {
            width: 100%;
            padding: 30px 40px 0 40px;
            margin-top: 64px;
        }

        .searchBox {
            width: 100%;
            max-width: 600px;
            height: 46px;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        .searchBox:focus {
            border-color: #999;
        }

        .searchResults {
            width: 100%;
            max-width: 600px;
            margin-top: 12px;
        }

        .searchResult {
            width: 100%;
            min-height: 72px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .searchResultPic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            flex-shrink: 0;
        }

        .searchResultInfo {
            flex: 1;
            min-width: 0;
            margin-left: 12px;
        }

        .searchResultName {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .searchResultUsername {
            font-size: 13px;
            color: #777;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewProfileButton {
            border: none;
            background: #111;
            color: white;
            border-radius: 5px;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .viewProfileButton:hover {
            background: #333;
        }

        .noResults {
            color: #777;
            font-size: 14px;
            padding: 8px 2px;
        }
    </style>
</head>

<body>

    <header class="topbar">

        <button
            class="menuButton"
            onclick="toggleMenu()"
        >
            ☰
        </button>

        <div class="logo">
            FoxxyDen
        </div>

        <div
            class="account"
            id="account"
        >

            <button
                id="loginButton"
                class="loginButton"
                onclick="loginWithDiscord()"
            >
                Login with Discord
            </button>

            <div
                id="profile"
                class="profile"
                onclick="toggleProfileMenu()"
            >

                <img
                    id="profilePic"
                    class="profilePic"
                    src=""
                    alt="Profile picture"
                >

                <span
                    id="profileName"
                    class="profileName"
                >
                    Player
                </span>

                <span
                    id="verificationBadge"
                    class="verified"
                    style="display: none;"
                >
                    <span>✓</span>
                </span>

            </div>

            <div
                id="profileMenu"
                class="profileMenu"
            >

                <button onclick="viewProfile(event)">
                    View Profile
                </button>

                <button onclick="signOut(event)">
                    Sign Out
                </button>

            </div>

        </div>

    </header>

    <aside
        id="sidebar"
        class="sidebar"
    >
        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>
    </aside>

    <main>

        <div class="searchArea">

            <input
                id="searchInput"
                class="searchBox"
                type="text"
                placeholder="Search users by username..."
                autocomplete="off"
            >

            <div
                id="searchResults"
                class="searchResults"
            ></div>

        </div>

    </main>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let currentUser = null;
        let searchTimeout = null;

        function toggleMenu() {
            document
                .getElementById("sidebar")
                .classList
                .toggle("open");
        }

        async function loginWithDiscord() {

            const { error } =
                await db.auth.signInWithOAuth({
                    provider: "discord",
                    options: {
                        redirectTo:
                            "https://amberfoxterry.github.io/FoxxyDen/index.html"
                    }
                });

            if (error) {
                alert(error.message);
            }
        }

        function toggleProfileMenu() {
            document
                .getElementById("profileMenu")
                .classList
                .toggle("open");
        }

        function viewProfile(event) {

            event.stopPropagation();

            window.location.href =
                "profile.html";
        }

        async function signOut(event) {

            event.stopPropagation();

            const { error } =
                await db.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            window.location.href =
                "index.html";
        }

        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            currentUser =
                session.user;

            const metadata =
                currentUser.user_metadata || {};

            const displayName =
                metadata.global_name ||
                metadata.custom_claims?.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Player";

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";

            document
                .getElementById("loginButton")
                .style.display =
                    "none";

            document
                .getElementById("profile")
                .style.display =
                    "flex";

            document
                .getElementById("profileName")
                .textContent =
                    displayName;

            if (avatar) {
                document
                    .getElementById("profilePic")
                    .src =
                        avatar;
            }

            if (
                VERIFIED_UIDS.includes(
                    currentUser.id
                )
            ) {
                document
                    .getElementById(
                        "verificationBadge"
                    )
                    .style.display =
                        "inline-flex";
            }
        }

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function() {

                    clearTimeout(
                        searchTimeout
                    );

                    const search =
                        this.value.trim();

                    if (!search) {

                        document
                            .getElementById(
                                "searchResults"
                            )
                            .innerHTML =
                                "";

                        return;
                    }

                    searchTimeout =
                        setTimeout(
                            () => searchUsers(search),
                            250
                        );
                }
            );

        async function searchUsers(search) {

            const results =
                document.getElementById(
                    "searchResults"
                );

            results.innerHTML =
                '<div class="noResults">Searching...</div>';

            const {
                data,
                error
            } = await db
                .from("profiles")
                .select(
                    "uuid, username, display_name, avatar_url"
                )
                .ilike(
                    "username",
                    "%" + search + "%"
                )
                .limit(10);

            if (error) {

                console.error(
                    "Search error:",
                    error
                );

                results.innerHTML =
                    '<div class="noResults">Could not search users.</div>';

                return;
            }

            if (
                !data ||
                data.length === 0
            ) {

                results.innerHTML =
                    '<div class="noResults">No users found.</div>';

                return;
            }

            results.innerHTML = "";

            data.forEach(
                function(user) {

                    const result =
                        document.createElement(
                            "div"
                        );

                    result.className =
                        "searchResult";

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "searchResultPic";

                    image.src =
                        user.avatar_url || "";

                    image.alt =
                        "Profile picture";

                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "searchResultInfo";

                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "searchResultName";

                    name.textContent =
                        user.display_name ||
                        user.username ||
                        "Player";

                    const username =
                        document.createElement(
                            "div"
                        );

                    username.className =
                        "searchResultUsername";

                    username.textContent =
                        "@" +
                        user.username;

                    info.appendChild(
                        name
                    );

                    info.appendChild(
                        username
                    );

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "viewProfileButton";

                    button.textContent =
                        "View Profile";

                    button.onclick =
                        function() {

                            window.location.href =
                                "user.html?user=" +
                                encodeURIComponent(
                                    user.username
                                );
                        };

                    result.appendChild(
                        image
                    );

                    result.appendChild(
                        info
                    );

                    result.appendChild(
                        button
                    );

                    results.appendChild(
                        result
                    );
                }
            );
        }

        document.addEventListener(
            "click",
            function(event) {

                const account =
                    document.getElementById(
                        "account"
                    );

                if (
                    !account.contains(
                        event.target
                    )
                ) {
                    document
                        .getElementById(
                            "profileMenu"
                        )
                        .classList
                        .remove("open");
                }
            }
        );

        async function initialize() {
            await loadAccount();
        }

        initialize();
    </script>

</body>
</html>
