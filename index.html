<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoxxyDen - Menu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
            color: #111;
        }

        /* TOP BAR */

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        /* ACCOUNT */

        #account {
            position: absolute;
            right: 18px;
            top: 8px;
            height: 48px;
            display: flex;
            align-items: center;
        }

        #loginButton {
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginButton:hover {
            background: #4752C4;
        }

        #profile {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 5px 10px 5px 5px;
            border-radius: 25px;
            cursor: pointer;
            user-select: none;
        }

        #profile:hover {
            background: #e5e5e5;
        }

        #profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        #profileNameContainer {
            display: flex;
            align-items: center;
        }

        #profileName {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* VERIFICATION */

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        /* PROFILE MENU */

        #profileMenu {
            display: none;
            position: absolute;
            top: 56px;
            right: 0;
            width: 190px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            z-index: 100;
        }

        #profileMenu.open {
            display: block;
        }

        .profileOption {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: none;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .profileOption:hover {
            background: #f1f1f1;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }

        /* SEARCH */

        .searchArea {
            width: 90%;
            max-width: 1100px;
            margin: 110px auto 80px auto;
        }

        .searchBox {
            width: 100%;
            height: 46px;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        .searchBox:focus {
            border-color: #999;
        }

        .searchResults {
            width: 100%;
            margin-top: 20px;
        }

        /* USER RESULT */

        .searchResult {
            width: 100%;
            min-height: 92px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
        }

        .searchResultPic {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            flex-shrink: 0;
        }

        .searchResultInfo {
            flex: 1;
            min-width: 0;
            margin-left: 16px;
        }

        .searchResultName {
            font-size: 18px;
            font-weight: 700;
            color: #111;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .searchResultUsername {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewProfileButton {
            border: none;
            background: #111;
            color: white;
            border-radius: 6px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .viewProfileButton:hover {
            background: #333;
        }

        /* GAME RESULT */

        .gameResult {
            width: 100%;
            min-height: 78px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .gameResultInfo {
            flex: 1;
            min-width: 0;
        }

        .gameResultName {
            font-size: 18px;
            font-weight: 800;
            color: #111;
        }

        .gameResultOnline {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        .joinGameButton {
            border: none;
            background: #35a853;
            color: white;
            border-radius: 6px;
            padding: 11px 18px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
        }

        .joinGameButton:hover {
            background: #27833f;
        }

        .noResults {
            color: #999;
            font-size: 15px;
            padding: 10px 0;
        }

        .sectionTitle {
            font-size: 13px;
            font-weight: 800;
            color: #888;
            text-transform: uppercase;
            margin: 0 0 10px 2px;
        }

        @media (max-width: 700px) {

            .searchArea {
                margin-top: 90px;
            }

            .searchResult {
                min-height: 80px;
            }

            .searchResultPic {
                width: 50px;
                height: 50px;
            }

            .viewProfileButton,
            .joinGameButton {
                padding: 9px 11px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <div
            class="menu"
            onclick="toggleMenu()"
        >
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div
            class="logo"
            onclick="location.href='index.html'"
        >
            FoxxyDen
        </div>

        <div id="account">

            <button
                id="loginButton"
                onclick="loginWithDiscord()"
            >
                LOGIN WITH DISCORD
            </button>

            <div
                id="profile"
                onclick="toggleProfileMenu()"
            >

                <img
                    id="profilePic"
                    src=""
                    alt="Profile picture"
                >

                <div id="profileNameContainer">

                    <span id="profileName"></span>

                    <span
                        id="verificationBadge"
                        class="verified"
                        style="display: none;"
                    >
                        <span>✓</span>
                    </span>

                </div>

            </div>

            <div id="profileMenu">

                <button
                    class="profileOption"
                    onclick="viewProfile(event)"
                >
                    View Profile
                </button>

                <button
                    class="profileOption"
                    onclick="signOut(event)"
                >
                    Sign Out
                </button>

            </div>

        </div>

    </div>


    <!-- SIDEBAR -->

    <div
        class="sidebar"
        id="sidebar"
    >

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>


    <!-- SEARCH -->

    <main>

        <div class="searchArea">

            <input
                id="searchInput"
                class="searchBox"
                type="text"
                placeholder="Search users or games..."
                autocomplete="off"
            >

            <div
                id="searchResults"
                class="searchResults"
            ></div>

        </div>

    </main>


    <script>

        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        let currentUser = null;
        let searchTimeout = null;


        /*
         * Games
         */

        const games = [
            {
                name: "Foxxy Hangout",
                searchName: "foxxy hangout",
                url: "games/foxxyhangout.html",
                online: 0
            }
        ];


        /*
         * Live game presence.
         *
         * Foxxy Hangout will announce itself
         * through this channel.
         */

        let gamePresenceChannel = null;


        function toggleMenu() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }


        async function loginWithDiscord() {

            const { error } =
                await db.auth.signInWithOAuth({

                    provider: "discord",

                    options: {
                        redirectTo:
                            "https://amberfoxterry.github.io/FoxxyDen/index.html"
                    }

                });

            if (error) {
                alert(error.message);
            }
        }


        function toggleProfileMenu() {

            document
                .getElementById("profileMenu")
                .classList.toggle("open");
        }


        function viewProfile(event) {

            event.stopPropagation();

            window.location.href =
                "profile.html";
        }


        async function signOut(event) {

            event.stopPropagation();

            const { error } =
                await db.auth.signOut();

            if (error) {

                alert(error.message);
                return;
            }

            window.location.href =
                "index.html";
        }


        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            currentUser =
                session.user;

            const metadata =
                currentUser.user_metadata || {};


            const displayName =
                metadata.global_name ||
                metadata.custom_claims?.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Player";


            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";


            document
                .getElementById("loginButton")
                .style.display =
                    "none";


            document
                .getElementById("profile")
                .style.display =
                    "flex";


            document
                .getElementById("profileName")
                .textContent =
                    displayName;


            if (avatar) {

                document
                    .getElementById("profilePic")
                    .src =
                        avatar;
            }


            if (
                VERIFIED_UIDS.includes(
                    currentUser.id
                )
            ) {

                document
                    .getElementById(
                        "verificationBadge"
                    )
                    .style.display =
                        "inline-flex";
            }

        }


        /*
         * Start the game lobby listener.
         */

        function startGamePresence() {

            gamePresenceChannel =
                db.channel(
                    "foxxy-hangout-lobby",
                    {
                        config: {
                            presence: {
                                key:
                                    crypto.randomUUID()
                            }
                        }
                    }
                );


            gamePresenceChannel.on(
                "presence",
                {
                    event: "sync"
                },
                function() {

                    updateGameOnlineCount();

                }
            );


            gamePresenceChannel.on(
                "presence",
                {
                    event: "join"
                },
                function() {

                    updateGameOnlineCount();

                }
            );


            gamePresenceChannel.on(
                "presence",
                {
                    event: "leave"
                },
                function() {

                    updateGameOnlineCount();

                }
            );


            gamePresenceChannel.subscribe(
                async function(status) {

                    if (
                        status !==
                        "SUBSCRIBED"
                    ) {
                        return;
                    }


                    /*
                     * This page itself does NOT
                     * count as a player.
                     *
                     * We only listen to the
                     * lobby.
                     */

                    updateGameOnlineCount();
                }
            );
        }


        function updateGameOnlineCount() {

            if (
                !gamePresenceChannel
            ) {
                return;
            }


            const state =
                gamePresenceChannel
                    .presenceState();


            /*
             * Every player announces their
             * own unique ID.
             *
             * Use a Set so duplicate presence
             * entries cannot increase the count.
             */

            const playerIds =
                new Set();


            Object.values(
                state
            ).forEach(
                function(players) {

                    players.forEach(
                        function(player) {

                            if (
                                player &&
                                player.id
                            ) {

                                playerIds.add(
                                    player.id
                                );

                            }

                        }
                    );

                }
            );


            games[0].online =
                playerIds.size;


            renderGames(
                document
                    .getElementById(
                        "searchInput"
                    )
                    .value
                    .trim()
            );
        }


        /*
         * Render game results.
         */

        function renderGames(
            search
        ) {

            const results =
                document.getElementById(
                    "searchResults"
                );


            const matchingGames =
                games
                    .filter(
                        function(game) {

                            if (!search) {
                                return true;
                            }

                            return game.name
                                .toLowerCase()
                                .includes(
                                    search.toLowerCase()
                                );
                        }
                    )
                    .sort(
                        function(a, b) {

                            return b.online -
                                a.online;
                        }
                    );


            if (
                matchingGames.length === 0
            ) {
                return;
            }


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "sectionTitle";

            title.textContent =
                "Games";


            results.appendChild(
                title
            );


            matchingGames.forEach(
                function(game) {

                    const result =
                        document.createElement(
                            "div"
                        );

                    result.className =
                        "gameResult";


                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "gameResultInfo";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "gameResultName";

                    name.textContent =
                        game.name;


                    const online =
                        document.createElement(
                            "div"
                        );

                    online.className =
                        "gameResultOnline";

                    online.textContent =
                        game.online +
                        " online";


                    info.appendChild(
                        name
                    );

                    info.appendChild(
                        online
                    );


                    const button =
                        document.createElement(
                            "button"
                        );

                    button.className =
                        "joinGameButton";

                    button.textContent =
                        "JOIN";


                    button.onclick =
                        function() {

                            window.location.href =
                                game.url;
                        };


                    result.appendChild(
                        info
                    );

                    result.appendChild(
                        button
                    );


                    results.appendChild(
                        result
                    );

                }
            );
        }


        /*
         * Search users AND games.
         */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function() {

                    clearTimeout(
                        searchTimeout
                    );

                    const search =
                        this.value.trim();


                    if (!search) {

                        renderHome();

                        return;
                    }


                    searchTimeout =
                        setTimeout(
                            function() {

                                searchUsersAndGames(
                                    search
                                );

                            },
                            250
                        );
                }
            );


        async function searchUsersAndGames(
            search
        ) {

            const results =
                document.getElementById(
                    "searchResults"
                );


            results.innerHTML =
                '<div class="noResults">Searching...</div>';


            const {
                data,
                error
            } = await db
                .from("profiles")
                .select(
                    "uuid, username, display_name, avatar_url"
                )
                .ilike(
                    "username",
                    "%" + search + "%"
                )
                .limit(10);


            results.innerHTML =
                "";


            /*
             * Games
             */

            renderGames(
                search
            );


            /*
             * Users
             */

            if (error) {

                console.error(
                    "Search error:",
                    error
                );

                return;
            }


            if (
                data &&
                data.length > 0
            ) {

                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "sectionTitle";

                title.textContent =
                    "Users";


                results.appendChild(
                    title
                );


                data.forEach(
                    function(user) {

                        const result =
                            document.createElement(
                                "div"
                            );

                        result.className =
                            "searchResult";


                        const image =
                            document.createElement(
                                "img"
                            );

                        image.className =
                            "searchResultPic";

                        image.src =
                            user.avatar_url ||
                            "";

                        image.alt =
                            "Profile picture";


                        const info =
                            document.createElement(
                                "div"
                            );

                        info.className =
                            "searchResultInfo";


                        const name =
                            document.createElement(
                                "div"
                            );

                        name.className =
                            "searchResultName";

                        name.textContent =
                            user.display_name ||
                            user.username ||
                            "Player";


                        const username =
                            document.createElement(
                                "div"
                            );

                        username.className =
                            "searchResultUsername";

                        username.textContent =
                            "@" +
                            user.username;


                        info.appendChild(
                            name
                        );

                        info.appendChild(
                            username
                        );


                        const button =
                            document.createElement(
                                "button"
                            );

                        button.className =
                            "viewProfileButton";

                        button.textContent =
                            "View Profile";


                        button.onclick =
                            function() {

                                window.location.href =
                                    "user.html?user=" +
                                    encodeURIComponent(
                                        user.username
                                    );

                            };


                        result.appendChild(
                            image
                        );

                        result.appendChild(
                            info
                        );

                        result.appendChild(
                            button
                        );


                        results.appendChild(
                            result
                        );

                    }
                );

            }


            if (
                results.children.length === 0
            ) {

                results.innerHTML =
                    '<div class="noResults">No users or games found.</div>';
            }
        }


        /*
         * Home screen:
         * games sorted by online players.
         */

        function renderHome() {

            const results =
                document.getElementById(
                    "searchResults"
                );


            results.innerHTML =
                "";


            renderGames("");
        }


        document.addEventListener(
            "click",
            function(event) {

                const account =
                    document.getElementById(
                        "account"
                    );


                if (
                    !account.contains(
                        event.target
                    )
                ) {

                    document
                        .getElementById(
                            "profileMenu"
                        )
                        .classList
                        .remove("open");
                }

            }
        );


        /*
         * Start everything.
         */

        loadAccount();

        startGamePresence();

        renderHome();

    </script>

</body>
</html>
