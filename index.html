<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBLOX - MENU</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        /* ACCOUNT */

        #account {
            position: absolute;
            right: 18px;
            top: 8px;
            height: 48px;
            display: flex;
            align-items: center;
        }

        #loginButton {
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginButton:hover {
            background: #4752C4;
        }

        #profile {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 5px 10px 5px 5px;
            border-radius: 25px;
            cursor: pointer;
        }

        #profile:hover {
            background: #e5e5e5;
        }

        #profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        #profileName {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="logo" onclick="location.href='index.html'">
            BOBLOX
        </div>

        <div id="account">

            <button id="loginButton" onclick="loginWithDiscord()">
                LOGIN WITH DISCORD
            </button>

            <div id="profile">
                <img id="profilePic" src="" alt="Profile picture">
                <span id="profileName"></span>
            </div>

        </div>

    </div>

    <div class="sidebar" id="sidebar">
        <a href="shop.html">Shop</a>
        <a href="accessories.html">Customization</a>
        <a href="settings.html">Settings</a>
    </div>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        function toggleMenu() {
            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }

        async function loginWithDiscord() {

            const { error } = await db.auth.signInWithOAuth({
                provider: "discord",
                options: {
                    redirectTo:
                        "https://amberfoxterry.github.io/Boblox/index.html"
                }
            });

            if (error) {
                alert(error.message);
            }
        }

        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            const user = session.user;
            const metadata = user.user_metadata || {};

            const username =
                metadata.full_name ||
                metadata.name ||
                metadata.preferred_username ||
                "Boblox Player";

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";

            document.getElementById("loginButton").style.display =
                "none";

            document.getElementById("profile").style.display =
                "flex";

            document.getElementById("profileName").textContent =
                username;

            if (avatar) {
                document.getElementById("profilePic").src =
                    avatar;
            }
        }

        loadAccount();
    </script>

</body>
</html>
