<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxxyDen - Menu</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        /* ACCOUNT */

        #account {
            position: absolute;
            right: 18px;
            top: 8px;
            height: 48px;
            display: flex;
            align-items: center;
        }

        #loginButton {
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginButton:hover {
            background: #4752C4;
        }

        #profile {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 5px 10px 5px 5px;
            border-radius: 25px;
            cursor: pointer;
            user-select: none;
        }

        #profile:hover {
            background: #e5e5e5;
        }

        #profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        #profileNameContainer {
            display: flex;
            align-items: center;
        }

        #profileName {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* VERIFIED HEART */

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        /* PROFILE MENU */

        #profileMenu {
            display: none;
            position: absolute;
            top: 56px;
            right: 0;
            width: 190px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            z-index: 100;
        }

        #profileMenu.open {
            display: block;
        }

        .profileOption {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: none;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .profileOption:hover {
            background: #f1f1f1;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }

        /* SEARCH */

        .searchArea {
            width: 100%;
            padding: 30px 40px 0 40px;
        }

        .searchBox {
            width: 100%;
            max-width: 600px;
            height: 46px;
            border: 1px solid #ccc;
            border-radius: 7px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        .searchBox:focus {
            border-color: #999;
        }

        .searchResults {
            width: 100%;
            max-width: 600px;
            margin-top: 12px;
        }

        .searchResult {
            width: 100%;
            min-height: 72px;
            border: 1px solid #ddd;
            border-radius: 7px;
            background: #f7f7f7;
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .searchResultPic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            flex-shrink: 0;
        }

        .searchResultInfo {
            flex: 1;
            min-width: 0;
            margin-left: 12px;
        }

        .searchResultName {
            font-size: 16px;
            font-weight: 700;
            color: #111;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .searchResultUsername {
            font-size: 13px;
            color: #777;
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .viewProfileButton {
            border: none;
            background: #111;
            color: white;
            border-radius: 5px;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .viewProfileButton:hover {
            background: #333;
        }

        .noResults {
            color: #777;
            font-size: 14px;
            padding: 8px 2px;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="logo" onclick="location.href='index.html'">
            FoxxyDen
        </div>

        <div id="account">

            <button id="loginButton" onclick="loginWithDiscord()">
                LOGIN WITH DISCORD
            </button>

            <div id="profile" onclick="toggleProfileMenu()">

                <img
                    id="profilePic"
                    src=""
                    alt="Profile picture"
                >

                <div id="profileNameContainer">

                    <span id="profileName"></span>

                    <span
                        id="verificationBadge"
                        class="verified"
                        style="display: none;"
                    >
                        <span>✓</span>
                    </span>

                </div>

            </div>

            <div id="profileMenu">

                <button
                    class="profileOption"
                    onclick="viewProfile(event)"
                >
                    View Profile
                </button>

                <button
                    class="profileOption"
                    onclick="signOut(event)"
                >
                    Sign Out
                </button>

            </div>

        </div>

    </div>

    <div class="sidebar" id="sidebar">

        <a href="shop.html">
            Shop
        </a>

        <a href="customazition.html">
            Customization
        </a>

        <a href="settings.html">
            Settings
        </a>

    </div>

    <!-- SEARCH -->

    <div class="searchArea">

        <input
            id="searchInput"
            class="searchBox"
            type="text"
            placeholder="Search users by username..."
            autocomplete="off"
        >

        <div
            id="searchResults"
            class="searchResults"
        ></div>

    </div>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        function toggleMenu() {

            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }

        async function loginWithDiscord() {

            const { error } =
                await db.auth.signInWithOAuth({
                    provider: "discord",

                    options: {
                        redirectTo:
                            "https://amberfoxterry.github.io/FoxxyDen/index.html"
                    }
                });

            if (error) {
                alert(error.message);
            }
        }

        function toggleProfileMenu() {

            document
                .getElementById("profileMenu")
                .classList.toggle("open");
        }

        function viewProfile(event) {

            event.stopPropagation();

            window.location.href =
                "profile.html";
        }

        async function signOut(event) {

            event.stopPropagation();

            const { error } =
                await db.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            document
                .getElementById("profileMenu")
                .classList.remove("open");

            document
                .getElementById("profile")
                .style.display = "none";

            document
                .getElementById("loginButton")
                .style.display = "block";
        }

        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            const user = session.user;

            const metadata =
                user.user_metadata || {};

            const displayName =
                metadata.global_name ||
                metadata.custom_claims?.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Player";

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";

            document
                .getElementById("loginButton")
                .style.display = "none";

            document
                .getElementById("profile")
                .style.display = "flex";

            document
                .getElementById("profileName")
                .textContent = displayName;

            if (avatar) {

                document
                    .getElementById("profilePic")
                    .src = avatar;
            }

            if (VERIFIED_UIDS.includes(user.id)) {

                document
                    .getElementById("verificationBadge")
                    .style.display = "inline-flex";
            }
        }

        /* SEARCH USERS */

        let searchTimeout = null;

        document
            .getElementById("searchInput")
            .addEventListener("input", function() {

                clearTimeout(searchTimeout);

                const search =
                    this.value.trim();

                if (!search) {

                    document
                        .getElementById("searchResults")
                        .innerHTML = "";

                    return;
                }

                searchTimeout = setTimeout(
                    () => searchUsers(search),
                    250
                );
            });

        async function searchUsers(search) {

            const results =
                document.getElementById(
                    "searchResults"
                );

            results.innerHTML =
                '<div class="noResults">Searching...</div>';

            const { data, error } =
                await db
                    .from("profiles")
                    .select(
                        "uuid, username, display_name, avatar_url"
                    )
                    .ilike(
                        "username",
                        "%" + search + "%"
                    )
                    .limit(10);

            if (error) {

                console.error(
                    "Search error:",
                    error
                );

                results.innerHTML =
                    '<div class="noResults">Could not search users.</div>';

                return;
            }

            if (!data || data.length === 0) {

                results.innerHTML =
                    '<div class="noResults">No users found.</div>';

                return;
            }

            results.innerHTML = "";

            data.forEach(function(user) {

                const result =
                    document.createElement("div");

                result.className =
                    "searchResult";

                const image =
                    document.createElement("img");

                image.className =
                    "searchResultPic";

                image.src =
                    user.avatar_url || "";

                image.alt =
                    "Profile picture";

                const info =
                    document.createElement("div");

                info.className =
                    "searchResultInfo";

                const name =
                    document.createElement("div");

                name.className =
                    "searchResultName";

                name.textContent =
                    user.display_name ||
                    user.username ||
                    "Player";

                const username =
                    document.createElement("div");

                username.className =
                    "searchResultUsername";

                username.textContent =
                    "@" + user.username;

                info.appendChild(name);
                info.appendChild(username);

                const button =
                    document.createElement("button");

                button.className =
                    "viewProfileButton";

                button.textContent =
                    "View Profile";

                button.onclick =
                    function() {

                        window.location.href =
                            "profile.html?user=" +
                            encodeURIComponent(
                                user.uuid
                            );
                    };

                result.appendChild(image);
                result.appendChild(info);
                result.appendChild(button);

                results.appendChild(result);
            });
        }

        document.addEventListener(
            "click",
            function(event) {

                const account =
                    document.getElementById("account");

                if (!account.contains(event.target)) {

                    document
                        .getElementById("profileMenu")
                        .classList
                        .remove("open");
                }
            }
        );

        loadAccount();
    </script>

</body>
</html>
