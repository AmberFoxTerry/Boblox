<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBLOX - MENU</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        .topbar {
            width: 100%;
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding-left: 18px;
            border-bottom: 1px solid #dedede;
            position: relative;
        }

        .menu {
            width: 28px;
            height: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu span {
            width: 100%;
            height: 3px;
            background: #111;
            border-radius: 2px;
        }

        .logo {
            margin-left: 18px;
            font-size: 25px;
            font-weight: 900;
            color: #111;
            letter-spacing: -1px;
            cursor: pointer;
        }

        /* ACCOUNT */

        #account {
            position: absolute;
            right: 18px;
            top: 8px;
            height: 48px;
            display: flex;
            align-items: center;
        }

        #loginButton {
            background: #5865F2;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 11px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #loginButton:hover {
            background: #4752C4;
        }

        #profile {
            display: none;
            align-items: center;
            gap: 9px;
            padding: 5px 10px 5px 5px;
            border-radius: 25px;
            cursor: pointer;
            user-select: none;
        }

        #profile:hover {
            background: #e5e5e5;
        }

        #profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        #profileNameContainer {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        #profileName {
            font-size: 15px;
            font-weight: 700;
            color: #111;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* VERIFICATION HEART */

        .verified {
            position: relative;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
            font-size: 10px;
            font-weight: 900;
            line-height: 1;
            z-index: 1;
        }

        .verified::before,
        .verified::after {
            content: "";
            position: absolute;
            top: 1px;
            width: 10px;
            height: 15px;
            background: #ff69b4;
            border-radius: 10px 10px 0 0;
            z-index: -1;
        }

        .verified::before {
            left: 8px;
            transform: rotate(45deg);
            transform-origin: 0 100%;
        }

        .verified::after {
            left: 0;
            transform: rotate(-45deg);
            transform-origin: 100% 100%;
        }

        .verified span {
            position: relative;
            z-index: 2;
            transform: translateY(1px);
        }

        /* PROFILE MENU */

        #profileMenu {
            display: none;
            position: absolute;
            top: 56px;
            right: 0;
            width: 190px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            z-index: 100;
        }

        #profileMenu.open {
            display: block;
        }

        .profileOption {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: none;
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .profileOption:hover {
            background: #f1f1f1;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f5f5f5;
            border-right: 1px solid #ddd;
            transition: left 0.2s ease;
            padding: 20px 0;
            z-index: 10;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            padding: 18px 24px;
            color: #111;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
        }

        .sidebar a:hover {
            background: #e5e5e5;
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="logo" onclick="location.href='index.html'">
            BOBLOX
        </div>

        <div id="account">

            <button id="loginButton" onclick="loginWithDiscord()">
                LOGIN WITH DISCORD
            </button>

            <div id="profile" onclick="toggleProfileMenu()">

                <img id="profilePic" src="" alt="Profile picture">

                <div id="profileNameContainer">
                    <span id="profileName"></span>

                    <span
                        id="verificationBadge"
                        class="verified"
                        style="display: none;"
                    >
                        <span>✓</span>
                    </span>
                </div>

            </div>

            <div id="profileMenu">

                <button
                    class="profileOption"
                    onclick="viewProfile(event)"
                >
                    View Profile
                </button>

                <button
                    class="profileOption"
                    onclick="signOut(event)"
                >
                    Sign Out
                </button>

            </div>

        </div>

    </div>

    <div class="sidebar" id="sidebar">
        <a href="shop.html">Shop</a>
        <a href="accessories.html">Customization</a>
        <a href="settings.html">Settings</a>
    </div>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        function toggleMenu() {
            document
                .getElementById("sidebar")
                .classList.toggle("open");
        }

        async function loginWithDiscord() {

            const { error } = await db.auth.signInWithOAuth({
                provider: "discord",
                options: {
                    redirectTo:
                        "https://amberfoxterry.github.io/Boblox/index.html"
                }
            });

            if (error) {
                alert(error.message);
            }
        }

        function toggleProfileMenu() {

            document
                .getElementById("profileMenu")
                .classList.toggle("open");
        }

        function viewProfile(event) {

            event.stopPropagation();

            window.location.href = "profile.html";
        }

        async function signOut(event) {

            event.stopPropagation();

            const { error } = await db.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            document.getElementById("profileMenu")
                .classList.remove("open");

            document.getElementById("profile")
                .style.display = "none";

            document.getElementById("loginButton")
                .style.display = "block";
        }

        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            const user = session.user;
            const metadata = user.user_metadata || {};

            const displayName =
                metadata.global_name ||
                metadata.custom_claims?.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Boblox Player";

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";

            document.getElementById("loginButton")
                .style.display = "none";

            document.getElementById("profile")
                .style.display = "flex";

            document.getElementById("profileName")
                .textContent = displayName;

            if (avatar) {
                document.getElementById("profilePic")
                    .src = avatar;
            }

            if (VERIFIED_UIDS.includes(user.id)) {
                document.getElementById("verificationBadge")
                    .style.display = "inline-flex";
            }
        }

        document.addEventListener("click", function(event) {

            const account =
                document.getElementById("account");

            if (!account.contains(event.target)) {
                document.getElementById("profileMenu")
                    .classList.remove("open");
            }

        });

        loadAccount();
    </script>

</body>
</html>
