<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoxxyDen - User</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: white;
            color: #111;
        }

        .topbar {
            height: 64px;
            background: #f3f3f3;
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .menuButton {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
            margin-right: 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
        }

        .account {
            margin-left: auto;
            display: flex;
            align-items: center;
            position: relative;
        }

        .loginButton {
            border: none;
            background: #111;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
        }

        .profile {
            display: none;
            align-items: center;
            gap: 9px;
            cursor: pointer;
        }

        .profilePic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .profileName {
            font-weight: 700;
        }

        .verified {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin-left: 5px;
            flex-shrink: 0;
        }

        .verified::before {
            content: "♥";
            position: absolute;
            color: #ff69b4;
            font-size: 26px;
            line-height: 26px;
        }

        .verified span {
            position: relative;
            z-index: 1;
            color: white;
            font-size: 12px;
            font-weight: 900;
            line-height: 1;
            transform: translateY(-1px);
        }

        .profileMenu {
            display: none;
            position: absolute;
            right: 0;
            top: 52px;
            width: 180px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 7px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .profileMenu.open {
            display: block;
        }

        .profileMenu button {
            width: 100%;
            border: none;
            background: white;
            text-align: left;
            padding: 13px;
            cursor: pointer;
            font-size: 14px;
        }

        .profileMenu button:hover {
            background: #f3f3f3;
        }

        .sidebar {
            position: fixed;
            top: 64px;
            left: -280px;
            width: 280px;
            bottom: 0;
            background: #f3f3f3;
            transition: left 0.2s ease;
            z-index: 900;
            padding: 20px;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar a {
            display: block;
            color: #111;
            text-decoration: none;
            font-weight: 700;
            padding: 13px 10px;
            border-radius: 6px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background: #ddd;
        }

        .profilePage {
            width: 90%;
            max-width: 1100px;
            margin: 140px auto 80px;
        }

        .profileTop {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 40px;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .bigAvatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .identityName {
            display: flex;
            align-items: center;
        }

        .name {
            font-size: 32px;
            font-weight: 800;
        }

        .characterPreview {
            width: 260px;
            height: 260px;
            background: #f3f3f3;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character {
            width: 150px;
            height: 150px;
            background: #999;
            border-radius: 8px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #ddd;
            margin: 45px 0;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .wearing {
            display: flex;
            gap: 15px;
        }

        .wearingItem {
            width: 180px;
        }

        .wearingItemPreview {
            width: 180px;
            height: 180px;
            background: #f3f3f3;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .grayItem {
            width: 150px;
            height: 150px;
            background: #999;
            border-radius: 8px;
        }

        .wearingItemName {
            margin-top: 10px;
            font-weight: 700;
            text-align: center;
        }

        .bio {
            width: 100%;
            min-height: 80px;
            color: #333;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .emptyBio {
            color: #999;
        }

        @media (max-width: 700px) {
            .profileTop {
                flex-direction: column;
            }

            .characterPreview {
                width: 100%;
            }

            .identity {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <button class="menuButton" onclick="toggleMenu()">☰</button>

        <div class="logo">
            FoxxyDen
        </div>

        <div class="account" id="account">

            <button
                id="loginButton"
                class="loginButton"
                onclick="loginWithDiscord()"
            >
                Login with Discord
            </button>

            <div
                id="profile"
                class="profile"
                onclick="toggleProfileMenu()"
            >
                <img
                    id="profilePic"
                    class="profilePic"
                    src=""
                    alt="Profile picture"
                >

                <span
                    id="profileName"
                    class="profileName"
                >
                    Player
                </span>

                <span
                    id="verificationBadge"
                    class="verified"
                    style="display: none;"
                >
                    <span>✓</span>
                </span>
            </div>

            <div
                id="profileMenu"
                class="profileMenu"
            >
                <button onclick="viewOwnProfile(event)">
                    View Profile
                </button>

                <button onclick="signOut(event)">
                    Sign Out
                </button>
            </div>

        </div>
    </header>

    <aside id="sidebar" class="sidebar">
        <a href="shop.html">Shop</a>
        <a href="customazition.html">Customization</a>
        <a href="settings.html">Settings</a>
    </aside>

    <main class="profilePage">

        <section class="profileTop">

            <div class="identity">

                <img
                    id="bigAvatar"
                    class="bigAvatar"
                    src=""
                    alt="Profile picture"
                >

                <div class="identityName">

                    <span
                        id="displayName"
                        class="name"
                    >
                        Player
                    </span>

                    <span
                        id="bigVerificationBadge"
                        class="verified"
                        style="display: none;"
                    >
                        <span>✓</span>
                    </span>

                </div>

            </div>

            <div
                id="characterPreview"
                class="characterPreview"
            >
                <div class="character"></div>
            </div>

        </section>

        <div class="divider"></div>

        <h2>Currently wearing</h2>

        <div
            id="wearing"
            class="wearing"
        >
            <div class="wearingItem">

                <div class="wearingItemPreview">
                    <div class="grayItem"></div>
                </div>

                <div class="wearingItemName">
                    Default Gray
                </div>

            </div>
        </div>

        <div class="divider"></div>

        <h2>Bio</h2>

        <div
            id="bio"
            class="bio"
        >
            <span class="emptyBio">
                No bio yet.
            </span>
        </div>

    </main>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const VERIFIED_UIDS = [
            "ca2cdea0-9fbd-4380-a34b-e505540ade35"
        ];

        const db = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        let currentUser = null;

        function toggleMenu() {
            document
                .getElementById("sidebar")
                .classList
                .toggle("open");
        }

        async function loginWithDiscord() {
            const { error } =
                await db.auth.signInWithOAuth({
                    provider: "discord",
                    options: {
                        redirectTo:
                            "https://amberfoxterry.github.io/FoxxyDen/index.html"
                    }
                });

            if (error) {
                alert(error.message);
            }
        }

        function toggleProfileMenu() {
            document
                .getElementById("profileMenu")
                .classList
                .toggle("open");
        }

        function viewOwnProfile(event) {
            event.stopPropagation();

            window.location.href =
                "profile.html";
        }

        async function signOut(event) {
            event.stopPropagation();

            const { error } =
                await db.auth.signOut();

            if (error) {
                alert(error.message);
                return;
            }

            window.location.href =
                "index.html";
        }

        async function loadAccount() {

            const {
                data: { session }
            } = await db.auth.getSession();

            if (!session) {
                return;
            }

            currentUser = session.user;

            const metadata =
                currentUser.user_metadata || {};

            const displayName =
                metadata.global_name ||
                metadata.custom_claims?.global_name ||
                metadata.full_name ||
                metadata.name ||
                "Player";

            const avatar =
                metadata.avatar_url ||
                metadata.picture ||
                "";

            document
                .getElementById("loginButton")
                .style.display = "none";

            document
                .getElementById("profile")
                .style.display = "flex";

            document
                .getElementById("profileName")
                .textContent = displayName;

            if (avatar) {
                document
                    .getElementById("profilePic")
                    .src = avatar;
            }

            if (
                VERIFIED_UIDS.includes(
                    currentUser.id
                )
            ) {
                document
                    .getElementById(
                        "verificationBadge"
                    )
                    .style.display =
                        "inline-flex";
            }
        }

        async function loadUser() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            const username =
                params.get("user");

            if (!username) {

                document
                    .getElementById("displayName")
                    .textContent =
                        "User not found";

                return;
            }

            const { data, error } =
                await db
                    .from("profiles")
                    .select(
                        "uuid, username, display_name, avatar_url, bio, owned"
                    )
                    .eq("username", username)
                    .single();

            if (error || !data) {

                console.error(
                    "Could not load user:",
                    error
                );

                document
                    .getElementById("displayName")
                    .textContent =
                        "User not found";

                return;
            }

            const displayName =
                data.display_name ||
                data.username ||
                "Player";

            document
                .getElementById("displayName")
                .textContent =
                    displayName;

            if (data.avatar_url) {
                document
                    .getElementById("bigAvatar")
                    .src =
                        data.avatar_url;
            }

            if (
                VERIFIED_UIDS.includes(
                    data.uuid
                )
            ) {
                document
                    .getElementById(
                        "bigVerificationBadge"
                    )
                    .style.display =
                        "inline-flex";
            }

            const bioElement =
                document.getElementById("bio");

            if (
                data.bio &&
                data.bio.trim() !== ""
            ) {
                bioElement.textContent =
                    data.bio;
            } else {
                bioElement.innerHTML =
                    '<span class="emptyBio">No bio yet.</span>';
            }
        }

        document.addEventListener(
            "click",
            function(event) {

                const account =
                    document.getElementById(
                        "account"
                    );

                if (
                    !account.contains(
                        event.target
                    )
                ) {
                    document
                        .getElementById(
                            "profileMenu"
                        )
                        .classList
                        .remove("open");
                }
            }
        );

        async function initialize() {
            await loadAccount();
            await loadUser();
        }

        initialize();
    </script>

</body>
</html>
