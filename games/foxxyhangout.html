<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foxxy Hangout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

body {
    background: #181818;
    display: flex;
}


/* =========================
   GAME
========================= */

#gameArea {
    flex: 1;
    height: 100%;
    position: relative;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}


/* =========================
   CHAT
========================= */

#chat {
    width: 300px;
    height: 100%;
    background: #eeeeee;
    border-left: 1px solid #cccccc;

    display: flex;
    flex-direction: column;
}

#chatHeader {
    height: 55px;

    display: flex;
    align-items: center;

    padding: 0 16px;

    font-size: 20px;
    font-weight: 800;

    color: #111;

    border-bottom: 1px solid #d0d0d0;

    background: #f5f5f5;
}

#chatMessages {
    flex: 1;

    overflow-y: auto;

    padding: 12px;
}

.chatMessage {
    margin-bottom: 10px;
    word-wrap: break-word;
}

.chatName {
    font-weight: 800;
    color: #111;
    margin-right: 5px;
}

.chatText {
    color: #333;
}

#chatInputContainer {
    padding: 10px;

    border-top: 1px solid #d0d0d0;

    background: #f5f5f5;
}

#chatInput {
    width: 100%;
    height: 40px;

    padding: 0 12px;

    border: 1px solid #c8c8c8;
    border-radius: 6px;

    outline: none;

    font-size: 15px;

    background: white;
}

#chatInput:focus {
    border-color: #888;
}

</style>
</head>

<body>

<div id="gameArea">
    <canvas id="game"></canvas>
</div>

<div id="chat">

    <div id="chatHeader">
        Chat
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputContainer">

        <input
            id="chatInput"
            type="text"
            placeholder="Type a message..."
            maxlength="200"
            autocomplete="off"
        >

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   DOM
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const gameArea =
    document.getElementById("gameArea");

const chatInput =
    document.getElementById("chatInput");

const chatMessages =
    document.getElementById("chatMessages");


/* =========================
   PLAYER ID
========================= */

const playerId =
    crypto.randomUUID();


let playerName = "Player";


/* =========================
   ROOM
========================= */

const room = {
    width: 1100,
    height: 600
};


/* =========================
   LOCAL PLAYER
========================= */

const player = {

    x: 525,
    y: 400,

    width: 50,
    height: 50,

    velocityX: 0,
    velocityY: 0,

    speed: 5,
    jumpPower: 13,

    gravity: 0.6,

    grounded: false,

    color: "#999999"
};


/* =========================
   OTHER PLAYERS
========================= */

const otherPlayers = {};


/* =========================
   INPUT
========================= */

const keys = {

    a: false,
    d: false,
    space: false

};


/* =========================
   CAMERA / ROOM POSITION
========================= */

let roomX = 0;
let roomY = 0;


/* =========================
   NETWORK
========================= */

let multiplayerChannel = null;


/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();

    if (!session) {

        playerName =
            "Player";

        startMultiplayer();

        return;
    }

    const metadata =
        session.user.user_metadata || {};

    playerName =
        metadata.global_name ||
        metadata.custom_claims?.global_name ||
        metadata.full_name ||
        metadata.name ||
        "Player";

    startMultiplayer();
}

loadPlayer();


/* =========================
   CANVAS
========================= */

function resize() {

    canvas.width =
        gameArea.clientWidth;

    canvas.height =
        gameArea.clientHeight;

    positionRoom();
}

function positionRoom() {

    roomX =
        (canvas.width - room.width) / 2;

    roomY =
        (canvas.height - room.height) / 2;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   MULTIPLAYER
========================= */

function startMultiplayer() {

    multiplayerChannel =
        db.channel(
            "foxxy-hangout-main",
            {
                config: {
                    broadcast: {
                        self: false
                    },
                    presence: {
                        key: playerId
                    }
                }
            }
        );


    /*
     * Someone sends their position
     */

    multiplayerChannel.on(
        "broadcast",
        {
            event: "player_position"
        },
        function(payload) {

            const data =
                payload.payload;

            if (!data) {
                return;
            }

            if (
                data.id === playerId
            ) {
                return;
            }

            otherPlayers[data.id] = {

                id: data.id,

                name:
                    data.name ||
                    "Player",

                x:
                    Number(data.x) || 0,

                y:
                    Number(data.y) || 0,

                width: 50,
                height: 50,

                color:
                    "#999999",

                lastSeen:
                    Date.now()
            };
        }
    );


    /*
     * Someone leaves
     */

    multiplayerChannel.on(
        "presence",
        {
            event: "leave"
        },
        function(payload) {

            const left =
                payload.leftPresences || [];

            left.forEach(function(
                presence
            ) {

                const id =
                    presence.id ||
                    presence.key;

                if (id) {
                    delete otherPlayers[id];
                }
            });
        }
    );


    /*
     * Multiplayer chat
     */

    multiplayerChannel.on(
        "broadcast",
        {
            event: "chat"
        },
        function(payload) {

            const data =
                payload.payload;

            if (!data) {
                return;
            }

            addChatMessage(
                data.name ||
                "Player",

                data.message ||
                ""
            );
        }
    );


    /*
     * Connect
     */

    multiplayerChannel.subscribe(
        async function(status) {

            if (status !== "SUBSCRIBED") {
                return;
            }

            await multiplayerChannel.track({

                id: playerId,

                name: playerName

            });

            sendPlayerPosition();
        }
    );
}


/* =========================
   SEND POSITION
========================= */

function sendPlayerPosition() {

    if (!multiplayerChannel) {
        return;
    }

    multiplayerChannel.send({

        type: "broadcast",

        event: "player_position",

        payload: {

            id: playerId,

            name: playerName,

            x: player.x,

            y: player.y

        }

    });
}


/*
 * Send movement roughly 20 times/sec
 */

setInterval(
    sendPlayerPosition,
    50
);


/* =========================
   CHAT
========================= */

function addChatMessage(
    name,
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "chatMessage";


    const nameElement =
        document.createElement("span");

    nameElement.className =
        "chatName";

    nameElement.textContent =
        name + ":";


    const textElement =
        document.createElement("span");

    textElement.className =
        "chatText";

    textElement.textContent =
        " " + message;


    wrapper.appendChild(
        nameElement
    );

    wrapper.appendChild(
        textElement
    );


    chatMessages.appendChild(
        wrapper
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Enter"
        ) {
            return;
        }

        const message =
            chatInput.value.trim();

        if (!message) {
            return;
        }


        /*
         * Show locally immediately
         */

        addChatMessage(
            playerName,
            message
        );


        /*
         * Send to everyone else
         */

        if (multiplayerChannel) {

            multiplayerChannel.send({

                type: "broadcast",

                event: "chat",

                payload: {

                    id: playerId,

                    name: playerName,

                    message: message

                }

            });
        }


        chatInput.value = "";
    }
);


/* =========================
   INPUT
========================= */

window.addEventListener(
    "keydown",
    function(event) {

        /*
         * No movement while
         * typing in chat.
         */

        if (
            document.activeElement ===
            chatInput
        ) {
            return;
        }


        if (
            event.key === "a" ||
            event.key === "A"
        ) {

            keys.a = true;
        }


        if (
            event.key === "d" ||
            event.key === "D"
        ) {

            keys.d = true;
        }


        if (
            event.code === "Space"
        ) {

            if (
                !keys.space &&
                player.grounded
            ) {

                player.velocityY =
                    -player.jumpPower;

                player.grounded =
                    false;
            }

            keys.space = true;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "a" ||
            event.key === "A"
        ) {

            keys.a = false;
        }


        if (
            event.key === "d" ||
            event.key === "D"
        ) {

            keys.d = false;
        }


        if (
            event.code === "Space"
        ) {

            keys.space = false;
        }
    }
);


/*
 * Stop movement immediately
 * when chat gets focus.
 */

chatInput.addEventListener(
    "focus",
    function() {

        keys.a = false;
        keys.d = false;
        keys.space = false;

        player.velocityX = 0;
    }
);


/* =========================
   GAME UPDATE
========================= */

function update() {


    /*
     * Horizontal movement
     */

    player.velocityX = 0;


    if (
        document.activeElement !==
        chatInput
    ) {

        if (keys.a) {

            player.velocityX =
                -player.speed;
        }


        if (keys.d) {

            player.velocityX =
                player.speed;
        }
    }


    player.x +=
        player.velocityX;


    /*
     * Gravity
     */

    player.velocityY +=
        player.gravity;

    player.y +=
        player.velocityY;


    /*
     * Floor
     */

    const floorY =
        room.height - 50;


    if (
        player.y +
        player.height >=
        floorY
    ) {

        player.y =
            floorY -
            player.height;

        player.velocityY =
            0;

        player.grounded =
            true;

    } else {

        player.grounded =
            false;
    }


    /*
     * Left wall
     */

    if (
        player.x < 20
    ) {

        player.x = 20;
    }


    /*
     * Right wall
     */

    if (
        player.x +
        player.width >
        room.width - 20
    ) {

        player.x =
            room.width -
            20 -
            player.width;
    }


    /*
     * Remove players that haven't
     * sent anything for 5 seconds.
     */

    const now =
        Date.now();


    Object.keys(
        otherPlayers
    ).forEach(function(id) {

        if (
            now -
            otherPlayers[id].lastSeen >
            5000
        ) {

            delete otherPlayers[id];
        }
    });
}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(
    p,
    offsetX,
    offsetY
) {

    /*
     * Name background
     */

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";


    const name =
        p.name || "Player";


    const nameWidth =
        ctx.measureText(
            name
        ).width + 16;


    const nameHeight =
        24;


    const centerX =
        offsetX +
        p.x +
        p.width / 2;


    const nameY =
        offsetY +
        p.y -
        10;


    ctx.fillStyle =
        "rgba(0,0,0,0.65)";


    ctx.fillRect(

        centerX -
        nameWidth / 2,

        nameY -
        nameHeight,

        nameWidth,

        nameHeight
    );


    /*
     * Name
     */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillText(

        name,

        centerX,

        nameY - 6
    );


    /*
     * Body
     */

    ctx.fillStyle =
        p.color ||
        "#999999";


    ctx.fillRect(

        offsetX +
        p.x,

        offsetY +
        p.y,

        p.width,

        p.height
    );


    /*
     * Outline
     */

    ctx.strokeStyle =
        "#666666";

    ctx.lineWidth =
        2;


    ctx.strokeRect(

        offsetX +
        p.x,

        offsetY +
        p.y,

        p.width,

        p.height
    );
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Outside world
     */

    ctx.fillStyle =
        "#181818";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * Room
     */

    ctx.fillStyle =
        "#f3f3f3";


    ctx.fillRect(

        roomX,
        roomY,

        room.width,
        room.height
    );


    /*
     * Floor
     */

    ctx.fillStyle =
        "#d0d0d0";


    ctx.fillRect(

        roomX,

        roomY +
        room.height -
        50,

        room.width,
        50
    );


    /*
     * Walls
     */

    ctx.fillStyle =
        "#c0c0c0";


    ctx.fillRect(

        roomX,
        roomY,

        20,
        room.height
    );


    ctx.fillRect(

        roomX +
        room.width -
        20,

        roomY,

        20,
        room.height
    );


    /*
     * Other players
     */

    Object.keys(
        otherPlayers
    ).forEach(function(id) {

        drawPlayer(

            otherPlayers[id],

            roomX,
            roomY
        );
    });


    /*
     * Local player
     */

    drawPlayer(

        player,

        roomX,
        roomY
    );
}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();

</script>

</body>
</html>
