<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxxy Hangout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#87ceeb 0%, #bde9ff 100%);
}

#world {
    position: absolute;
    left: 0;
    top: 0;
    right: 320px;
    bottom: 0;
    overflow: hidden;
}

#floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 80px;
    background: #65a84f;
    border-top: 5px solid #4b873a;
}

.wall {
    position: absolute;
    bottom: 80px;
    width: 25px;
    height: 100%;
    background: #777;
}

#leftWall {
    left: 0;
}

#rightWall {
    right: 0;
}

.player {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #888;
    border: 2px solid #555;
    border-radius: 4px;
    transform: translateX(-50%);
}

.playerName {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: white;
    font-size: 14px;
    font-weight: bold;
    text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;
    pointer-events: none;
}

#chat {
    position: absolute;
    top: 0;
    right: 0;
    width: 320px;
    height: 100%;
    background: #f3f3f3;
    border-left: 1px solid #ccc;
    display: flex;
    flex-direction: column;
}

#chatHeader {
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    background: white;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

.message {
    margin-bottom: 10px;
    word-wrap: break-word;
}

.messageName {
    font-weight: bold;
    margin-right: 5px;
}

#chatInputContainer {
    padding: 10px;
    border-top: 1px solid #ddd;
    background: white;
}

#chatInput {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
}

#chatInput:focus {
    border-color: #888;
}

#leaveButton {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 50;
    padding: 9px 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

#leaveButton:hover {
    background: #eee;
}

#roomStatus {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    padding: 7px 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <button id="leaveButton">
            Leave
        </button>

        <div id="roomStatus">
            Joining room...
        </div>

        <div id="floor"></div>

        <div id="leftWall" class="wall"></div>
        <div id="rightWall" class="wall"></div>

        <div id="localPlayer" class="player">
            <div id="localPlayerName" class="playerName">
                Player
            </div>
        </div>

    </div>

    <div id="chat">

        <div id="chatHeader">
            Chat
        </div>

        <div id="messages"></div>

        <div id="chatInputContainer">

            <input
                id="chatInput"
                type="text"
                placeholder="Type a message..."
                maxlength="300"
                autocomplete="off"
            >

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const MAX_PLAYERS = 4;

const localPlayer =
    document.getElementById("localPlayer");

const localPlayerName =
    document.getElementById("localPlayerName");

const messages =
    document.getElementById("messages");

const chatInput =
    document.getElementById("chatInput");

const chatHeader =
    document.getElementById("chatHeader");

const roomStatus =
    document.getElementById("roomStatus");


/* =========================
   CUSTOMIZATION
========================= */

const customizationColors = {
    gray: "#999",
    red: "red",
    green: "green",
    blue: "blue"
};

let equipped =
    "gray";


function getCustomizationColor(
    id
) {

    return (
        customizationColors[id] ||
        customizationColors.gray
    );
}


function applyLocalCustomization() {

    const color =
        getCustomizationColor(
            equipped
        );

    localPlayer.style.background =
        color;

    localPlayer.style.borderColor =
        equipped === "gray"
            ? "#555"
            : color;
}


/* =========================
   PLAYER / SESSION
========================= */

let playerId =
    crypto.randomUUID();

let accountId =
    null;

let sessionId =
    crypto.randomUUID();

let playerName =
    "Player";

let roomNumber =
    null;

let roomChannel =
    null;

let lobbyChannel =
    null;

let activeGameChannel =
    null;

let sessionHeartbeat =
    null;

let x = 300;
let y = 0;

let velocityY = 0;
let onGround = true;

let lastBroadcast = 0;

let leaving =
    false;

const keys = {
    left: false,
    right: false
};


/* =========================
   ACCOUNT
========================= */

async function loadPlayer() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();

    if (!session) {

        roomStatus.textContent =
            "Please log in first.";

        return false;
    }

    accountId =
        session.user.id;

    const metadata =
        session.user.user_metadata || {};

    playerName =
        metadata.global_name ||
        metadata.custom_claims?.global_name ||
        metadata.full_name ||
        metadata.name ||
        "Player";

    localPlayerName.textContent =
        playerName;


    /*
     * Load equipped customization
     * from the same profile used by
     * the Customization page.
     */
    const {
        data: profile,
        error
    } = await db
        .from("profiles")
        .select("equipped")
        .eq("uuid", accountId)
        .maybeSingle();

    if (error) {

        console.error(
            "Could not load customization:",
            error
        );

    } else if (profile) {

        equipped =
            profile.equipped ||
            "gray";
    }

    applyLocalCustomization();

    return true;
}


/* =========================
   ONE GAME PER ACCOUNT
========================= */

async function claimActiveGame() {

    if (!accountId) {
        return false;
    }

    const {
        data,
        error
    } = await db.rpc(
        "claim_game_session",
        {
            p_session_id: sessionId,
            p_game: "foxxy-hangout"
        }
    );

    if (error) {

        console.error(
            "Game session claim error:",
            error
        );

        roomStatus.textContent =
            "Could not verify game session.";

        return false;
    }

    if (!data) {

        roomStatus.textContent =
            "You are already in a game.";

        console.log(
            "Account already has an active game."
        );

        return false;
    }

    console.log(
        "Game session claimed."
    );

    sessionHeartbeat =
        setInterval(
            async () => {

                if (leaving) {
                    return;
                }

                const {
                    data,
                    error
                } = await db.rpc(
                    "refresh_game_session",
                    {
                        p_session_id:
                            sessionId
                    }
                );

                if (
                    error ||
                    !data
                ) {

                    console.error(
                        "Game session heartbeat failed:",
                        error
                    );

                    clearInterval(
                        sessionHeartbeat
                    );

                    sessionHeartbeat =
                        null;
                }

            },
            10000
        );

    return true;
}


/* =========================
   REMOTE PLAYERS
========================= */

function removeRemotePlayer(id) {

    if (!id) {
        return;
    }

    const player =
        document.getElementById(
            "player-" + id
        );

    if (player) {
        player.remove();
    }
}


function syncRemotePlayers() {

    if (!roomChannel) {
        return;
    }

    const state =
        roomChannel.presenceState();

    const activeIds =
        new Set();

    Object.values(state).forEach(
        players => {

            players.forEach(
                player => {

                    if (
                        player &&
                        player.id &&
                        player.id !== playerId
                    ) {

                        activeIds.add(
                            player.id
                        );
                    }
                }
            );
        }
    );

    document
        .querySelectorAll(
            ".player[id^='player-']"
        )
        .forEach(player => {

            const id =
                player.id.substring(
                    "player-".length
                );

            if (
                !activeIds.has(id)
            ) {

                player.remove();
            }
        });
}


/* =========================
   ROOM EVENTS
========================= */

function setupRoomEventsForChannel(
    channel
) {

    channel

        .on(
            "broadcast",
            {
                event: "position"
            },
            payload => {

                const data =
                    payload.payload;

                if (
                    !data ||
                    data.id === playerId
                ) {
                    return;
                }

                updateRemotePlayer(
                    data
                );
            }
        )

        .on(
            "broadcast",
            {
                event: "chat"
            },
            payload => {

                const data =
                    payload.payload;

                if (
                    !data ||
                    data.id === playerId
                ) {
                    return;
                }

                addMessage(
                    data.name || "Player",
                    data.message
                );
            }
        )

        .on(
            "presence",
            {
                event: "sync"
            },
            () => {

                console.log(
                    "Room presence synced"
                );

                syncRemotePlayers();
            }
        )

        .on(
            "presence",
            {
                event: "join"
            },
            payload => {

                console.log(
                    "Player joined:",
                    payload
                );
            }
        )

        .on(
            "presence",
            {
                event: "leave"
            },
            payload => {

                console.log(
                    "Player left:",
                    payload
                );

                const leftPresences =
                    payload.leftPresences ||
                    [];

                Object.values(
                    leftPresences
                ).forEach(
                    presence => {

                        if (
                            presence &&
                            presence.id
                        ) {

                            removeRemotePlayer(
                                presence.id
                            );
                        }
                    }
                );

                setTimeout(
                    syncRemotePlayers,
                    100
                );
            }
        );
}


/* =========================
   JOIN ROOM
========================= */

async function joinAvailableRoom() {

    for (
        let i = 1;
        i <= 100;
        i++
    ) {

        if (leaving) {
            return false;
        }

        const channelName =
            "foxxy-hangout-room-" + i;

        const channel =
            db.channel(
                channelName,
                {
                    config: {

                        broadcast: {
                            self: false
                        },

                        presence: {
                            key: playerId
                        }
                    }
                }
            );

        setupRoomEventsForChannel(
            channel
        );

        const joined =
            await new Promise(
                resolve => {

                    let finished =
                        false;

                    const timeout =
                        setTimeout(
                            () => {

                                if (
                                    !finished
                                ) {

                                    finished =
                                        true;

                                    resolve(
                                        false
                                    );
                                }

                            },
                            8000
                        );

                    channel.subscribe(
                        status => {

                            console.log(
                                "Room",
                                i,
                                "status:",
                                status
                            );

                            if (
                                status ===
                                "SUBSCRIBED" &&
                                !finished
                            ) {

                                finished =
                                    true;

                                clearTimeout(
                                    timeout
                                );

                                resolve(
                                    true
                                );
                            }

                            if (
                                (
                                    status ===
                                    "CHANNEL_ERROR" ||

                                    status ===
                                    "TIMED_OUT" ||

                                    status ===
                                    "CLOSED"
                                ) &&
                                !finished
                            ) {

                                finished =
                                    true;

                                clearTimeout(
                                    timeout
                                );

                                resolve(
                                    false
                                );
                            }
                        }
                    );
                }
            );

        if (!joined) {

            await db.removeChannel(
                channel
            );

            continue;
        }

        const state =
            channel.presenceState();

        let playerCount =
            0;

        Object.values(state).forEach(
            players => {

                playerCount +=
                    players.length;
            }
        );

        console.log(
            "Room",
            i,
            "players:",
            playerCount
        );

        if (
            playerCount <
            MAX_PLAYERS
        ) {

            roomChannel =
                channel;

            roomNumber =
                i;

            try {

                await roomChannel.track({
                    id: playerId,
                    name: playerName,
                    equipped: equipped
                });

            } catch (error) {

                console.error(
                    "Room presence error:",
                    error
                );

                await db.removeChannel(
                    channel
                );

                roomChannel =
                    null;

                continue;
            }

            roomStatus.textContent =
                "Room " + roomNumber;

            chatHeader.textContent =
                "Chat · Room " + roomNumber;

            console.log(
                "Joined room:",
                roomNumber
            );

            return true;
        }

        await db.removeChannel(
            channel
        );
    }

    roomStatus.textContent =
        "Could not find a room.";

    return false;
}


/* =========================
   GLOBAL LOBBY PRESENCE
========================= */

async function joinLobby() {

    lobbyChannel =
        db.channel(
            "foxxy-hangout-lobby",
            {
                config: {
                    presence: {
                        key: playerId
                    }
                }
            }
        );

    lobbyChannel.subscribe(
        async status => {

            console.log(
                "Lobby status:",
                status
            );

            if (
                status ===
                "SUBSCRIBED"
            ) {

                try {

                    await lobbyChannel.track({
                        id: playerId,
                        accountId:
                            accountId,
                        name:
                            playerName,
                        game:
                            "foxxy-hangout",
                        equipped:
                            equipped
                    });

                    console.log(
                        "Joined Hangout lobby"
                    );

                } catch (error) {

                    console.error(
                        "Lobby presence error:",
                        error
                    );
                }
            }
        }
    );
}


/* =========================
   REMOTE PLAYER
========================= */

function updateRemotePlayer(
    data
) {

    let player =
        document.getElementById(
            "player-" + data.id
        );

    if (!player) {

        player =
            document.createElement(
                "div"
            );

        player.id =
            "player-" + data.id;

        player.className =
            "player";

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "playerName";

        name.textContent =
            data.name || "Player";

        player.appendChild(
            name
        );

        document
            .getElementById("world")
            .appendChild(
                player
            );
    }

    const color =
        getCustomizationColor(
            data.equipped
        );

    player.style.background =
        color;

    player.style.borderColor =
        data.equipped === "gray"
            ? "#555"
            : color;

    player.style.left =
        data.x + "px";

    player.style.bottom =
        (80 + data.y) + "px";
}


/* =========================
   POSITION
========================= */

function broadcastPosition() {

    const now =
        Date.now();

    if (
        now - lastBroadcast <
        50
    ) {
        return;
    }

    lastBroadcast =
        now;

    if (!roomChannel) {
        return;
    }

    roomChannel.send({

        type:
            "broadcast",

        event:
            "position",

        payload: {

            id:
                playerId,

            name:
                playerName,

            equipped:
                equipped,

            x:
                x,

            y:
                y
        }
    });
}


/* =========================
   CHAT
========================= */

function addMessage(
    name,
    message
) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message";

    const nameElement =
        document.createElement(
            "span"
        );

    nameElement.className =
        "messageName";

    nameElement.textContent =
        name + ":";

    const messageElement =
        document.createElement(
            "span"
        );

    messageElement.textContent =
        " " + message;

    wrapper.appendChild(
        nameElement
    );

    wrapper.appendChild(
        messageElement
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


function sendChatMessage() {

    const message =
        chatInput.value.trim();

    if (
        !message ||
        !roomChannel
    ) {
        return;
    }

    addMessage(
        playerName,
        message
    );

    roomChannel.send({

        type:
            "broadcast",

        event:
            "chat",

        payload: {

            id:
                playerId,

            name:
                playerName,

            message:
                message
        }
    });

    chatInput.value =
        "";
}


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendChatMessage();
        }
    }
);


/* =========================
   MOVEMENT
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            document.activeElement ===
            chatInput
        ) {
            return;
        }

        if (
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ) {

            keys.left =
                true;
        }

        if (
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ) {

            keys.right =
                true;
        }

        if (
            event.code === "Space"
        ) {

            if (onGround) {

                velocityY =
                    12;

                onGround =
                    false;
            }

            event.preventDefault();
        }
    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ) {

            keys.left =
                false;
        }

        if (
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ) {

            keys.right =
                false;
        }
    }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (leaving) {
        return;
    }

    const world =
        document.getElementById(
            "world"
        );

    const maxX =
        world.clientWidth -
        25 -
        21;

    if (
        document.activeElement !==
        chatInput
    ) {

        if (keys.left) {
            x -= 5;
        }

        if (keys.right) {
            x += 5;
        }
    }

    x =
        Math.max(
            25 + 21,
            Math.min(
                maxX,
                x
            )
        );

    velocityY -=
        0.6;

    y +=
        velocityY;

    if (y <= 0) {

        y =
            0;

        velocityY =
            0;

        onGround =
            true;
    }

    localPlayer.style.left =
        x + "px";

    localPlayer.style.bottom =
        (80 + y) + "px";

    broadcastPosition();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   LEAVE
========================= */

async function leaveGame() {

    if (leaving) {
        return;
    }

    leaving =
        true;

    if (sessionHeartbeat) {

        clearInterval(
            sessionHeartbeat
        );

        sessionHeartbeat =
            null;
    }

    if (accountId) {

        try {

            await db.rpc(
                "release_game_session",
                {
                    p_session_id:
                        sessionId
                }
            );

        } catch (error) {

            console.error(
                "Could not release game session:",
                error
            );
        }
    }

    if (roomChannel) {

        try {

            await db.removeChannel(
                roomChannel
            );

        } catch (error) {

            console.error(
                error
            );
        }

        roomChannel =
            null;
    }

    if (lobbyChannel) {

        try {

            await db.removeChannel(
                lobbyChannel
            );

        } catch (error) {

            console.error(
                error
            );
        }

        lobbyChannel =
            null;
    }

    window.location.href =
        "../index.html";
}


/* =========================
   BROWSER CLOSE / RELOAD
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        /*
         * Realtime channels disconnect
         * automatically here.
         *
         * The database heartbeat will stop,
         * so the stale lock expires after
         * 30 seconds.
         */
    }
);


/* =========================
   START
========================= */

async function start() {

    const loaded =
        await loadPlayer();

    if (!loaded) {
        return;
    }

    const claimed =
        await claimActiveGame();

    if (!claimed) {
        return;
    }

    const joined =
        await joinAvailableRoom();

    if (!joined) {

        if (sessionHeartbeat) {

            clearInterval(
                sessionHeartbeat
            );

            sessionHeartbeat =
                null;
        }

        try {

            await db.rpc(
                "release_game_session",
                {
                    p_session_id:
                        sessionId
                }
            );

        } catch (error) {

            console.error(
                error
            );
        }

        return;
    }

    joinLobby();

    gameLoop();
}

start();

</script>

</body>
</html>
