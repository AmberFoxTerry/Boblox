<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foxxy Hangout</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            display: block;
        }

        #chat {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100vh;
            background: #f3f3f3;
            border-left: 1px solid #ccc;
            display: flex;
            flex-direction: column;
        }

        #chatMessages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 12px;
            word-wrap: break-word;
        }

        .messageName {
            font-size: 14px;
            font-weight: 700;
            color: #111;
            margin-bottom: 3px;
        }

        .messageText {
            font-size: 14px;
            color: #333;
        }

        #chatInputArea {
            padding: 10px;
            border-top: 1px solid #ccc;
            background: white;
        }

        #chatInput {
            width: 100%;
            height: 40px;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 0 11px;
            font-size: 14px;
            outline: none;
        }

        #chatInput:focus {
            border-color: #999;
        }
    </style>
</head>

<body>

<canvas id="game"></canvas>

<div id="chat">

    <div id="chatMessages"></div>

    <div id="chatInputArea">
        <input
            id="chatInput"
            type="text"
            placeholder="Type a message..."
            maxlength="200"
            autocomplete="off"
        >
    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CANVAS
========================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const CHAT_WIDTH = 300;

function resize() {

    canvas.width =
        window.innerWidth -
        CHAT_WIDTH;

    canvas.height =
        window.innerHeight;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================
   ROOM
========================= */

const room = {
    width: 1100,
    height: 600,

    floorHeight: 40,
    wallWidth: 40,

    x: 0,
    y: 0
};


function positionRoom() {

    room.x =
        (canvas.width -
            room.width) / 2;

    room.y =
        (canvas.height -
            room.height) / 2;

    if (room.x < 20) {
        room.x = 20;
    }

    if (room.y < 20) {
        room.y = 20;
    }
}


/* =========================
   PLAYER
========================= */

const player = {

    x: 0,
    y: 0,

    width: 50,
    height: 50,

    velocityX: 0,
    velocityY: 0,

    speed: 5,
    jumpPower: 13,

    grounded: false,

    displayName: "Player",

    /* Default character */
    color: "#999"
};


/* Put player in room */

function positionPlayer() {

    player.x =
        room.x + 250;

    player.y =
        room.y +
        room.height -
        room.floorHeight -
        player.height;
}


/* =========================
   ACCOUNT
========================= */

async function loadPlayer() {

    const {
        data: { session }
    } = await db.auth.getSession();

    if (!session) {
        player.displayName = "Player";
        return;
    }

    const metadata =
        session.user.user_metadata || {};

    player.displayName =
        metadata.global_name ||
        metadata.custom_claims?.global_name ||
        metadata.full_name ||
        metadata.name ||
        "Player";
}

loadPlayer();


/* =========================
   INPUT
========================= */

const keys = {
    a: false,
    d: false,
    space: false
};


window.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "a" ||
            event.key === "A"
        ) {
            keys.a = true;
        }

        if (
            event.key === "d" ||
            event.key === "D"
        ) {
            keys.d = true;
        }

        if (event.code === "Space") {

            if (
                !keys.space &&
                player.grounded
            ) {

                player.velocityY =
                    -player.jumpPower;

                player.grounded = false;
            }

            keys.space = true;

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key === "a" ||
            event.key === "A"
        ) {
            keys.a = false;
        }

        if (
            event.key === "d" ||
            event.key === "D"
        ) {
            keys.d = false;
        }

        if (event.code === "Space") {
            keys.space = false;
        }
    }
);


/* =========================
   PHYSICS
========================= */

const gravity = 0.6;


function update() {

    player.velocityX = 0;

    if (keys.a) {
        player.velocityX =
            -player.speed;
    }

    if (keys.d) {
        player.velocityX =
            player.speed;
    }

    player.x +=
        player.velocityX;


    /* Left wall */

    const leftWall =
        room.x +
        room.wallWidth;


    if (player.x < leftWall) {
        player.x = leftWall;
    }


    /* Right wall */

    const rightWall =
        room.x +
        room.width -
        room.wallWidth -
        player.width;


    if (player.x > rightWall) {
        player.x = rightWall;
    }


    /* Gravity */

    player.velocityY +=
        gravity;

    player.y +=
        player.velocityY;


    /* Floor */

    const floorY =
        room.y +
        room.height -
        room.floorHeight -
        player.height;


    if (player.y >= floorY) {

        player.y = floorY;

        player.velocityY = 0;

        player.grounded = true;

    } else {

        player.grounded = false;
    }


    /* Ceiling */

    const ceilingY =
        room.y +
        room.wallWidth;


    if (player.y < ceilingY) {

        player.y = ceilingY;

        if (player.velocityY < 0) {
            player.velocityY = 0;
        }
    }
}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Background */

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Room */

    ctx.fillStyle =
        "#f3f3f3";

    ctx.fillRect(
        room.x,
        room.y,
        room.width,
        room.height
    );


    /* Floor */

    ctx.fillStyle =
        "#d0d0d0";

    ctx.fillRect(
        room.x,
        room.y +
            room.height -
            room.floorHeight,
        room.width,
        room.floorHeight
    );


    /* Walls */

    ctx.fillStyle =
        "#c0c0c0";


    /* Left */

    ctx.fillRect(
        room.x,
        room.y,
        room.wallWidth,
        room.height
    );


    /* Right */

    ctx.fillRect(
        room.x +
            room.width -
            room.wallWidth,
        room.y,
        room.wallWidth,
        room.height
    );


    /* Ceiling */

    ctx.fillRect(
        room.x,
        room.y,
        room.width,
        room.wallWidth
    );


    /* =========================
       PLAYER
    ========================= */

    ctx.fillStyle =
        player.color;

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );


    /* =========================
       COSMETICS
    ========================= */

    /*
        Nothing equipped yet.

        Future cosmetics will be
        drawn here.
    */


    /* =========================
       DISPLAY NAME
    ========================= */

    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "bottom";


    const nameX =
        player.x +
        player.width / 2;


    const nameY =
        player.y -
        8;


    const textWidth =
        ctx.measureText(
            player.displayName
        ).width;


    /* Name background */

    ctx.fillStyle =
        "rgba(0, 0, 0, 0.65)";

    ctx.fillRect(
        nameX -
            textWidth / 2 -
            6,
        nameY - 17,
        textWidth + 12,
        21
    );


    /* Name */

    ctx.fillStyle =
        "white";

    ctx.fillText(
        player.displayName,
        nameX,
        nameY
    );
}


/* =========================
   CHAT
========================= */

const chatInput =
    document.getElementById(
        "chatInput"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );


function addChatMessage(
    name,
    message
) {

    const container =
        document.createElement(
            "div"
        );

    container.className =
        "message";


    const nameElement =
        document.createElement(
            "div"
        );

    nameElement.className =
        "messageName";

    nameElement.textContent =
        name;


    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "messageText";

    textElement.textContent =
        message;


    container.appendChild(
        nameElement
    );

    container.appendChild(
        textElement
    );


    chatMessages.appendChild(
        container
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;
}


chatInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key !== "Enter"
        ) {
            return;
        }


        const message =
            chatInput.value.trim();


        if (!message) {
            return;
        }


        addChatMessage(
            player.displayName,
            message
        );


        chatInput.value = "";
    }
);


/* =========================
   START
========================= */

positionRoom();
positionPlayer();


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


gameLoop();

</script>

</body>
</html>
