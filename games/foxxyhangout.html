<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxxy Hangout</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #87ceeb;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#87ceeb 0%, #bde9ff 100%);
}

#world {
    position: absolute;
    left: 0;
    top: 0;
    right: 320px;
    bottom: 0;
    overflow: hidden;
}

#floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 80px;
    background: #65a84f;
    border-top: 5px solid #4b873a;
}

.wall {
    position: absolute;
    bottom: 80px;
    width: 25px;
    height: 100%;
    background: #777;
}

#leftWall {
    left: 0;
}

#rightWall {
    right: 0;
}

.player {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #888;
    border: 2px solid #555;
    border-radius: 4px;
    transform: translateX(-50%);
}

.playerName {
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    color: white;
    font-size: 14px;
    font-weight: bold;
    text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;
    pointer-events: none;
}

#chat {
    position: absolute;
    top: 0;
    right: 0;
    width: 320px;
    height: 100%;
    background: #f3f3f3;
    border-left: 1px solid #ccc;
    display: flex;
    flex-direction: column;
}

#chatHeader {
    height: 60px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 18px;
    font-weight: bold;
    border-bottom: 1px solid #ddd;
    background: white;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
}

.message {
    margin-bottom: 10px;
    word-wrap: break-word;
}

.messageName {
    font-weight: bold;
    margin-right: 5px;
}

#chatInputContainer {
    padding: 10px;
    border-top: 1px solid #ddd;
    background: white;
}

#chatInput {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 14px;
}

#chatInput:focus {
    border-color: #888;
}

#leaveButton {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 50;
    padding: 9px 14px;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

#leaveButton:hover {
    background: #eee;
}

#roomStatus {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    padding: 7px 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <button id="leaveButton">
            Leave
        </button>

        <div id="roomStatus">
            Joining room...
        </div>

        <div id="floor"></div>

        <div id="leftWall" class="wall"></div>
        <div id="rightWall" class="wall"></div>

        <div id="localPlayer" class="player">
            <div id="localPlayerName" class="playerName">
                Player
            </div>
        </div>

    </div>

    <div id="chat">

        <div id="chatHeader">
            Chat
        </div>

        <div id="messages"></div>

        <div id="chatInputContainer">

            <input
                id="chatInput"
                type="text"
                placeholder="Type a message..."
                maxlength="300"
                autocomplete="off"
            >

        </div>

    </div>

</div>

<script>

const SUPABASE_URL =
    "https://dpcixdjggpulxlekrqqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

const MAX_PLAYERS = 4;

const localPlayer =
    document.getElementById("localPlayer");

const localPlayerName =
    document.getElementById("localPlayerName");

const messages =
    document.getElementById("messages");

const chatInput =
    document.getElementById("chatInput");

const chatHeader =
    document.getElementById("chatHeader");

const roomStatus =
    document.getElementById("roomStatus");

let playerId =
    crypto.randomUUID();

let accountId =
    null;

let playerName =
    "Player";

let roomNumber =
    null;

let roomChannel =
    null;

let lobbyChannel =
    null;

let activeGameChannel =
    null;

let x = 300;
let y = 0;

let velocityY = 0;
let onGround = true;

let lastBroadcast = 0;

const keys = {
    left: false,
    right: false
};


/* =========================
   ACCOUNT
========================= */

async function loadPlayer() {

    const {
        data: {
            session
        }
    } = await db.auth.getSession();

    if (!session) {

        roomStatus.textContent =
            "Please log in first.";

        return false;
    }

    accountId =
        session.user.id;

    const metadata =
        session.user.user_metadata || {};

    playerName =
        metadata.global_name ||
        metadata.custom_claims?.global_name ||
        metadata.full_name ||
        metadata.name ||
        "Player";

    localPlayerName.textContent =
        playerName;

    return true;
}


/* =========================
   ONE GAME PER ACCOUNT
========================= */

async function claimActiveGame() {

    if (!accountId) {
        return false;
    }

    activeGameChannel =
        db.channel(
            "foxxy-active-games",
            {
                config: {
                    presence: {
                        key: playerId
                    }
                }
            }
        );

    const subscribed =
        await new Promise(resolve => {

            let finished = false;

            const timeout =
                setTimeout(() => {

                    if (!finished) {

                        finished = true;

                        resolve(false);
                    }

                }, 8000);

            activeGameChannel.subscribe(
                status => {

                    console.log(
                        "Active game status:",
                        status
                    );

                    if (
                        status ===
                        "SUBSCRIBED" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve(true);
                    }

                    if (
                        (
                            status ===
                            "CHANNEL_ERROR" ||

                            status ===
                            "TIMED_OUT" ||

                            status ===
                            "CLOSED"
                        ) &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve(false);
                    }
                }
            );
        });

    if (!subscribed) {

        await db.removeChannel(
            activeGameChannel
        );

        activeGameChannel =
            null;

        roomStatus.textContent =
            "Could not connect.";

        return false;
    }

    /*
     * Check every currently active account.
     */
    const state =
        activeGameChannel.presenceState();

    let alreadyPlaying =
        false;

    Object.values(state).forEach(
        players => {

            players.forEach(
                player => {

                    if (
                        player &&
                        player.accountId ===
                        accountId
                    ) {

                        alreadyPlaying =
                            true;
                    }
                }
            );
        }
    );

    if (alreadyPlaying) {

        console.log(
            "Account is already in a game."
        );

        roomStatus.textContent =
            "Already in a game.";

        await db.removeChannel(
            activeGameChannel
        );

        activeGameChannel =
            null;

        return false;
    }

    /*
     * Claim the account.
     */
    try {

        await activeGameChannel.track({
            accountId: accountId,
            playerId: playerId,
            name: playerName,
            game: "foxxy-hangout"
        });

        /*
         * Check again after tracking.
         * This catches another session that
         * appeared while we were connecting.
         */
        await new Promise(resolve =>
            setTimeout(resolve, 150)
        );

        const newState =
            activeGameChannel.presenceState();

        let duplicate =
            false;

        Object.values(newState).forEach(
            players => {

                players.forEach(
                    player => {

                        if (
                            player &&
                            player.accountId ===
                            accountId &&
                            player.playerId !==
                            playerId
                        ) {

                            duplicate =
                                true;
                        }
                    }
                );
            }
        );

        if (duplicate) {

            console.log(
                "Another session claimed this account."
            );

            await db.removeChannel(
                activeGameChannel
            );

            activeGameChannel =
                null;

            roomStatus.textContent =
                "Already in a game.";

            return false;
        }

        console.log(
            "Active game claimed."
        );

        return true;

    } catch (error) {

        console.error(
            "Active game error:",
            error
        );

        await db.removeChannel(
            activeGameChannel
        );

        activeGameChannel =
            null;

        return false;
    }
}


/* =========================
   ROOM EVENTS
========================= */

function removeRemotePlayer(id) {

    if (!id) {
        return;
    }

    const player =
        document.getElementById(
            "player-" + id
        );

    if (player) {
        player.remove();
    }
}


function syncRemotePlayers() {

    if (!roomChannel) {
        return;
    }

    const state =
        roomChannel.presenceState();

    const activeIds =
        new Set();

    Object.values(state).forEach(
        players => {

            players.forEach(
                player => {

                    if (
                        player &&
                        player.id &&
                        player.id !== playerId
                    ) {

                        activeIds.add(
                            player.id
                        );
                    }
                }
            );
        }
    );

    document
        .querySelectorAll(".player[id^='player-']")
        .forEach(player => {

            const id =
                player.id.substring(
                    "player-".length
                );

            if (!activeIds.has(id)) {
                player.remove();
            }
        });
}


function setupRoomEventsForChannel(channel) {

    channel

        .on(
            "broadcast",
            {
                event: "position"
            },
            payload => {

                const data =
                    payload.payload;

                if (
                    !data ||
                    data.id === playerId
                ) {
                    return;
                }

                updateRemotePlayer(data);
            }
        )

        .on(
            "broadcast",
            {
                event: "chat"
            },
            payload => {

                const data =
                    payload.payload;

                if (
                    !data ||
                    data.id === playerId
                ) {
                    return;
                }

                addMessage(
                    data.name || "Player",
                    data.message
                );
            }
        )

        .on(
            "presence",
            {
                event: "sync"
            },
            () => {

                console.log(
                    "Room presence synced"
                );

                syncRemotePlayers();
            }
        )

        .on(
            "presence",
            {
                event: "join"
            },
            payload => {

                console.log(
                    "Player joined:",
                    payload
                );
            }
        )

        .on(
            "presence",
            {
                event: "leave"
            },
            payload => {

                console.log(
                    "Player left:",
                    payload
                );

                const leftPresences =
                    payload.leftPresences || [];

                Object.values(
                    leftPresences
                ).forEach(
                    presence => {

                        if (
                            presence &&
                            presence.id
                        ) {

                            removeRemotePlayer(
                                presence.id
                            );
                        }
                    }
                );

                /*
                 * Re-check the actual room state
                 * so stale players cannot remain.
                 */
                setTimeout(
                    syncRemotePlayers,
                    100
                );
            }
        );
}


/* =========================
   JOIN ROOM
========================= */

async function joinAvailableRoom() {

    for (
        let i = 1;
        i <= 100;
        i++
    ) {

        const channelName =
            "foxxy-hangout-room-" + i;

        const channel =
            db.channel(
                channelName,
                {
                    config: {

                        broadcast: {
                            self: false
                        },

                        presence: {
                            key: playerId
                        }
                    }
                }
            );

        /*
         * IMPORTANT:
         * All .on() handlers must be added
         * BEFORE subscribe().
         */
        setupRoomEventsForChannel(
            channel
        );

        const joined =
            await new Promise(resolve => {

                let finished = false;

                const timeout =
                    setTimeout(() => {

                        if (!finished) {

                            finished = true;

                            resolve(false);
                        }

                    }, 8000);

                channel.subscribe(
                    status => {

                        console.log(
                            "Room",
                            i,
                            "status:",
                            status
                        );

                        if (
                            status ===
                            "SUBSCRIBED" &&
                            !finished
                        ) {

                            finished = true;

                            clearTimeout(
                                timeout
                            );

                            resolve(true);
                        }

                        if (
                            (
                                status ===
                                "CHANNEL_ERROR" ||

                                status ===
                                "TIMED_OUT" ||

                                status ===
                                "CLOSED"
                            ) &&
                            !finished
                        ) {

                            finished = true;

                            clearTimeout(
                                timeout
                            );

                            resolve(false);
                        }

                    }
                );

            });

        if (!joined) {

            await db.removeChannel(
                channel
            );

            continue;
        }

        const state =
            channel.presenceState();

        let playerCount = 0;

        Object.values(state).forEach(
            players => {

                playerCount +=
                    players.length;
            }
        );

        console.log(
            "Room",
            i,
            "players:",
            playerCount
        );

        if (
            playerCount < MAX_PLAYERS
        ) {

            roomChannel =
                channel;

            roomNumber =
                i;

            try {

                await roomChannel.track({
                    id: playerId,
                    name: playerName
                });

            } catch (error) {

                console.error(
                    "Room presence error:",
                    error
                );

                await db.removeChannel(
                    channel
                );

                roomChannel =
                    null;

                continue;
            }

            roomStatus.textContent =
                "Room " + roomNumber;

            chatHeader.textContent =
                "Chat · Room " + roomNumber;

            console.log(
                "Joined room:",
                roomNumber
            );

            return true;
        }

        await db.removeChannel(
            channel
        );
    }

    roomStatus.textContent =
        "Could not find a room.";

    return false;
}


/* =========================
   GLOBAL LOBBY PRESENCE
========================= */

async function joinLobby() {

    lobbyChannel =
        db.channel(
            "foxxy-hangout-lobby",
            {
                config: {
                    presence: {
                        key: playerId
                    }
                }
            }
        );

    lobbyChannel.subscribe(
        async status => {

            console.log(
                "Lobby status:",
                status
            );

            if (
                status ===
                "SUBSCRIBED"
            ) {

                try {

                    await lobbyChannel.track({
                        id: playerId,
                        accountId: accountId,
                        name: playerName,
                        game: "foxxy-hangout"
                    });

                    console.log(
                        "Joined Hangout lobby"
                    );

                } catch (error) {

                    console.error(
                        "Lobby presence error:",
                        error
                    );
                }
            }
        }
    );
}


/* =========================
   REMOTE PLAYERS
========================= */

function updateRemotePlayer(data) {

    let player =
        document.getElementById(
            "player-" + data.id
        );

    if (!player) {

        player =
            document.createElement("div");

        player.id =
            "player-" + data.id;

        player.className =
            "player";

        const name =
            document.createElement("div");

        name.className =
            "playerName";

        name.textContent =
            data.name || "Player";

        player.appendChild(
            name
        );

        document
            .getElementById("world")
            .appendChild(player);
    }

    player.style.left =
        data.x + "px";

    player.style.bottom =
        (80 + data.y) + "px";
}


/* =========================
   POSITION
========================= */

function broadcastPosition() {

    const now =
        Date.now();

    if (
        now - lastBroadcast < 50
    ) {
        return;
    }

    lastBroadcast =
        now;

    if (!roomChannel) {
        return;
    }

    roomChannel.send({
        type: "broadcast",

        event: "position",

        payload: {
            id: playerId,
            name: playerName,
            x: x,
            y: y
        }
    });
}


/* =========================
   CHAT
========================= */

function addMessage(
    name,
    message
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message";

    const nameElement =
        document.createElement("span");

    nameElement.className =
        "messageName";

    nameElement.textContent =
        name + ":";

    const messageElement =
        document.createElement("span");

    messageElement.textContent =
        " " + message;

    wrapper.appendChild(
        nameElement
    );

    wrapper.appendChild(
        messageElement
    );

    messages.appendChild(
        wrapper
    );

    messages.scrollTop =
        messages.scrollHeight;
}


function sendChatMessage() {

    const message =
        chatInput.value.trim();

    if (
        !message ||
        !roomChannel
    ) {
        return;
    }

    addMessage(
        playerName,
        message
    );

    roomChannel.send({
        type: "broadcast",

        event: "chat",

        payload: {
            id: playerId,
            name: playerName,
            message: message
        }
    });

    chatInput.value =
        "";
}


chatInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendChatMessage();
        }

    }
);


/* =========================
   MOVEMENT
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            document.activeElement ===
            chatInput
        ) {
            return;
        }

        if (
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ) {

            keys.left =
                true;
        }

        if (
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ) {

            keys.right =
                true;
        }

        if (
            event.code === "Space"
        ) {

            if (onGround) {

                velocityY =
                    12;

                onGround =
                    false;
            }

            event.preventDefault();
        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.key === "a" ||
            event.key === "A" ||
            event.key === "ArrowLeft"
        ) {

            keys.left =
                false;
        }

        if (
            event.key === "d" ||
            event.key === "D" ||
            event.key === "ArrowRight"
        ) {

            keys.right =
                false;
        }

    }
);


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    const world =
        document.getElementById(
            "world"
        );

    const maxX =
        world.clientWidth -
        25 -
        21;

    if (
        document.activeElement !==
        chatInput
    ) {

        if (keys.left) {
            x -= 5;
        }

        if (keys.right) {
            x += 5;
        }
    }

    x =
        Math.max(
            25 + 21,
            Math.min(
                maxX,
                x
            )
        );

    velocityY -=
        0.6;

    y +=
        velocityY;

    if (y <= 0) {

        y =
            0;

        velocityY =
            0;

        onGround =
            true;
    }

    localPlayer.style.left =
        x + "px";

    localPlayer.style.bottom =
        (80 + y) + "px";

    broadcastPosition();

    requestAnimationFrame(
        gameLoop
    );
}


/* =========================
   LEAVE
========================= */

async function leaveGame() {

    if (roomChannel) {

        try {

            await db.removeChannel(
                roomChannel
            );

        } catch (error) {

            console.error(
                error
            );
        }

        roomChannel =
            null;
    }

    if (lobbyChannel) {

        try {

            await db.removeChannel(
                lobbyChannel
            );

        } catch (error) {

            console.error(
                error
            );
        }

        lobbyChannel =
            null;
    }

    if (activeGameChannel) {

        try {

            await db.removeChannel(
                activeGameChannel
            );

        } catch (error) {

            console.error(
                error
            );
        }

        activeGameChannel =
            null;
    }

    window.location.href =
        "../index.html";
}


document
    .getElementById(
        "leaveButton"
    )
    .addEventListener(
        "click",
        leaveGame
    );


/* =========================
   START
========================= */

async function start() {

    const loaded =
        await loadPlayer();

    if (!loaded) {
        return;
    }

    /*
     * Claim the account before
     * entering any game room.
     */
    const claimed =
        await claimActiveGame();

    if (!claimed) {
        return;
    }

    const joined =
        await joinAvailableRoom();

    if (!joined) {

        if (activeGameChannel) {

            await db.removeChannel(
                activeGameChannel
            );

            activeGameChannel =
                null;
        }

        return;
    }

    joinLobby();

    gameLoop();
}

start();

</script>

</body>
</html>
