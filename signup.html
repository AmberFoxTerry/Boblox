<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBLOX - SIGN UP</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 360px;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #5865F2;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4752C4;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .login {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>BOBLOX</h1>

        <button onclick="loginWithDiscord()">
            CONTINUE WITH DISCORD
        </button>

        <div id="message"></div>

        <a class="login" href="login.html">
            Already have an account? Log in
        </a>

    </div>

    <script>
        const SUPABASE_URL =
            "https://dpcixdjggpulxlekrqqk.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_-312NjvVe6aLDGKsmMuZgQ_JfozDccs";

        const { createClient } = supabase;

        const db = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        async function loginWithDiscord() {

            const { error } =
                await db.auth.signInWithOAuth({
                    provider: "discord",
                    options: {
                        redirectTo:
                            window.location.origin +
                            "/Boblox/index.html"
                    }
                });

            if (error) {
                document.getElementById("message")
                    .textContent = error.message;
            }
        }
    </script>

</body>
</html>
